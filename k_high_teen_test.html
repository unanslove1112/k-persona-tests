<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-High Teen Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3466039113171143"
     crossorigin="anonymous"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3466039113171143" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg overflow-hidden relative">
        
        <div id="start-screen" class="px-6 py-12 text-center min-h-screen flex flex-col justify-center bg-gradient-to-b from-indigo-50 to-white">
            <h1 class="text-4xl font-extrabold text-indigo-600 mb-4 tracking-tight">K-High Teen</h1>
            <p class="text-gray-600 mb-8 font-medium">What's your Korean high school persona?</p>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-indigo-100 mb-8">
                <h2 class="text-xl font-bold mb-4">Step 1: Select Your Gender</h2>
                <div class="flex gap-4">
                    <button onclick="selectGender('M')" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-4 rounded-xl transition shadow-sm">👨 Male</button>
                    <button onclick="selectGender('F')" class="flex-1 bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold py-4 rounded-xl transition shadow-sm">👩 Female</button>
                </div>
            </div>
        </div>

        <div id="question-screen" class="hidden px-6 py-12 min-h-screen flex flex-col">
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex-1 flex flex-col justify-center">
                <h2 id="q-title" class="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">Question text</h2>
                <div class="space-y-4">
                    <button onclick="answer(0)" id="btn-a" class="w-full text-left bg-gray-50 hover:bg-indigo-50 border border-gray-200 hover:border-indigo-300 p-5 rounded-xl transition shadow-sm font-medium text-gray-700"></button>
                    <button onclick="answer(1)" id="btn-b" class="w-full text-left bg-gray-50 hover:bg-indigo-50 border border-gray-200 hover:border-indigo-300 p-5 rounded-xl transition shadow-sm font-medium text-gray-700"></button>
                </div>
            </div>
        </div>

        <div id="loading-screen" class="hidden px-6 py-12 text-center min-h-screen flex flex-col justify-center items-center bg-indigo-600 text-white">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-white mb-6"></div>
            <h2 class="text-2xl font-bold mb-2">Analyzing your vibe...</h2>
            <p class="text-indigo-200">Preparing your school ID card.</p>
        </div>

        <div id="result-screen" class="hidden px-6 py-10 min-h-screen bg-gray-50">
            <div class="text-center mb-6">
                <h3 class="text-sm font-bold text-indigo-500 mb-1">Your K-High Teen Persona is</h3>
                <h1 id="r-title" class="text-3xl font-extrabold text-gray-900">Result Title</h1>
            </div>
            <div id="r-img-div" class="w-full aspect-square bg-cover bg-no-repeat rounded-2xl mx-auto shadow-inner border border-white/50 mb-6" style="background-size: 200%; background-position: 0% 0%;"></div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6">
                <p id="r-desc" class="text-gray-600 leading-relaxed text-center mb-4"></p>
                <div class="bg-indigo-50 rounded-xl p-4 text-center">
                    <p class="text-xs text-indigo-400 font-bold mb-1">BEST MATCH</p>
                    <p id="r-match" class="font-bold text-indigo-700"></p>
                </div>
            </div>

            <div class="mb-6 text-center">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3466039113171143"
                     data-ad-slot="여기에_슬롯ID_입력"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
            </div>

            <div class="space-y-3 mb-8">
                <button onclick="location.href='index.html'" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-indigo-700 transition">🏠 Go to Lobby</button>
            </div>
        </div>
    </div>

    <script>
        let userGender = '';
        const questions = [
            { q: "You're 1 minute late! You turn the corner with toast in your mouth and bump into someone!", a: "Make eye contact while picking up their books.", b: "Quickly apologize and sprint to the gate." },
            { q: "It's finally lunchtime. Where are you heading?", a: "The noisy cafeteria to fight for spicy tteokbokki.", b: "The quiet rooftop or a corner in the library." },
            { q: "Your friend says: 'I was so stressed, I bought a new idol album.'", a: "'What happened? Why were you stressed?'", b: "'Which group? Did you get your bias photocard?'" },
            { q: "School festival is coming! What's your role?", a: "Center of the dance/band club performing on stage.", b: "The brain managing the budget behind the scenes." },
            { q: "A junior confesses to you with a handwritten letter.", a: "Feel touched and carefully write a warm reply.", b: "Logically explain why you can't date right now." }
        ];
        
        const resultsData = {
            F: [
                { id: "f1", title: "☀️ Sunshine Transfer Student", desc: "The ultimate social butterfly. You captured everyone's attention on your very first day!", match: "The Tsundere Class President" },
                { id: "f2", title: "👓 Tsundere Class President", desc: "Cold on the outside, warm on the inside. You secretly leave banana milk on your crush's desk.", match: "The Sunshine Transfer Student" },
                { id: "f3", title: "🎸 Rebellious Band Leader", desc: "Dangerous charm. You sleep through class but own the stage.", match: "The Quiet Library Angel" },
                { id: "f4", title: "📚 Quiet Library Angel", desc: "Master observer. You don't say much, but you care deeply about everyone.", match: "Rebellious Band Leader" }
            ],
            M: [
                { id: "m1", title: "🐶 Golden Retriever Junior", desc: "Bright and energetic. You follow your favorite upperclassman around like a puppy.", match: "Tsundere President" },
                { id: "m2", title: "🧊 Cold Chaebol Heir", desc: "Rich and untouchable, but you only have soft eyes for one person.", match: "Sunshine Student" },
                { id: "m3", title: "🎸 Bad Boy Musician", desc: "Always getting into trouble, but your guitar skills make everyone swoon.", match: "Library Angel" },
                { id: "m4", title: "🎧 Mysterious Senior", desc: "Always listening to music alone. You appear out of nowhere to help when needed.", match: "Band Leader" }
            ]
        };

        let currentQ = 0; let score = 0;

        function selectGender(g) {
            userGender = g;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            document.getElementById('q-title').innerText = questions[currentQ].q;
            document.getElementById('btn-a').innerText = questions[currentQ].a;
            document.getElementById('btn-b').innerText = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else {
                document.getElementById('question-screen').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                setTimeout(() => showResult(userGender === 'F' ? `f${(score % 4) + 1}` : `m${(score % 4) + 1}`), 2000);
            }
        }

        function showResult(resultId) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const result = resultsData[userGender].find(r => r.id === resultId);
            
            document.getElementById('r-title').innerText = result.title;
            document.getElementById('r-desc').innerText = result.desc;
            document.getElementById('r-match').innerText = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_high_teen_w.jpeg')" : "url('k_high_teen_m.jpeg')";
            
            const posArray = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"];
            imgDiv.style.backgroundPosition = posArray[resultsData[userGender].findIndex(r => r.id === resultId)];
            imgDiv.style.backgroundColor = "transparent";
        }
    </script>
</body>
</html>
