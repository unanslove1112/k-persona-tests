                    wellness: "To heavily protect your deeply sacred energy and prevent total, crushing burnout, you absolutely must learn to aggressively implement the highly powerful word 'No'. You critically need to actively engage in strictly physical, deeply grounding hobbies that explicitly force you out of your heavy, empathetic head—like aggressive gardening, intense pottery making, or rigorous physical hiking. It is entirely vital that you proactively seek out and deeply connect with highly robust, fiercely independent peers who absolutely do not require constant emotional fixing. Remember that stepping down from your heavy mountain to playfully experience pure, selfish joy is not a weakness; it is an absolute necessity for your soul's survival.<br><br><span class='text-xs opacity-80'>당신의 깊고 신성한 에너지를 무겁게 보호하고 완전하고 파괴적인 번아웃을 방지하려면, 매우 강력한 단어인 '아니오'를 공격적으로 실행하는 법을 반드시 배워야 합니다. 공격적인 정원 가꾸기, 강렬한 도자기 만들기, 또는 험난한 육체적 하이킹처럼 무겁고 공감으로 가득 찬 머릿속에서 명시적으로 벗어나게 만드는, 엄격하게 육체적이고 깊이 땅에 발을 딛는 취미에 적극적으로 참여해야 합니다. 끊임없는 감정적 치유를 절대적으로 필요로 하지 않는, 매우 강건하고 맹렬하게 독립적인 동료들을 선제적으로 찾고 그들과 깊이 교류하는 것은 전적으로 중요합니다. 무거운 산에서 내려와 순수하고 이기적인 기쁨을 장난스럽게 경험하는 것은 결코 약점이 아니며, 당신 영혼의 생존을 위한 절대적인 필수 조건임을 반드시 기억하십시오.</span>",

        function generateSlug(titleHtml) {
            const englishPart = titleHtml.split('<br>')[0];
            return englishPart.replace(/[^a-zA-Z0-9 ]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
        }

        window.onload = () => {
            const hash = window.location.hash;
            const match = hash.match(/#\/result\/([a-zA-Z0-9-]+)/);
            
            if(match) {
                const currentSlug = match[1];
                let foundGender = '';
                let foundId = '';
                
                for(let g of ['F', 'M']) {
                    for(let i=0; i<resultsData[g].length; i++) {
                        if(generateSlug(resultsData[g][i].title) === currentSlug) {
                            foundGender = g;
                            foundId = g.toLowerCase() + (i + 1);
                            break;
                        }
                    }
                }
                
                if(foundId) {
                    userGender = foundGender;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    showResult(foundId, true); 
                }
            }
        };

        // 안전한 화면 전환 로직 (flex 충돌 방지)

            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(toId).classList.remove('hidden');
        }

        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in');
            void qScreen.offsetWidth; 
            qScreen.classList.add('fade-in');

            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            
            if(currentQ < questions.length) {
                showQuestion();
            } else {
                switchScreen('question-screen', 'loading-screen');
                const finalIdx = score % 4; 
                const genId = userGender === 'F' ? `f${finalIdx + 1}` : `m${finalIdx + 1}`;
                setTimeout(() => showResult(genId, false), 2500);
            }
        }
