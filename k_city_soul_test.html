<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-City Soul Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg overflow-hidden relative">
        <div id="start-screen" class="px-6 py-12 text-center min-h-screen flex flex-col justify-center bg-gradient-to-b from-green-50 to-white">
            <h1 class="text-4xl font-extrabold text-green-600 mb-4 tracking-tight">K-City Soul</h1>
            <p class="text-gray-600 mb-8 font-medium">Where is your Korean soul city?</p>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-green-100 mb-8">
                <h2 class="text-xl font-bold mb-4">Step 1: Select Gender</h2>
                <div class="flex gap-4">
                    <button onclick="selectGender('M')" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-4 rounded-xl shadow-sm">👨 Male</button>
                    <button onclick="selectGender('F')" class="flex-1 bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold py-4 rounded-xl shadow-sm">👩 Female</button>
                </div>
            </div>
        </div>

        <div id="question-screen" class="hidden px-6 py-12 min-h-screen flex flex-col">
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-green-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex-1 flex flex-col justify-center">
                <h2 id="q-title" class="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">Question text</h2>
                <div class="space-y-4">
                    <button onclick="answer(0)" id="btn-a" class="w-full text-left bg-gray-50 hover:bg-green-50 border border-gray-200 hover:border-green-300 p-5 rounded-xl shadow-sm"></button>
                    <button onclick="answer(1)" id="btn-b" class="w-full text-left bg-gray-50 hover:bg-green-50 border border-gray-200 hover:border-green-300 p-5 rounded-xl shadow-sm"></button>
                </div>
            </div>
        </div>

        <div id="loading-screen" class="hidden px-6 py-12 text-center min-h-screen flex flex-col justify-center items-center bg-green-600 text-white">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-white mb-6"></div>
            <h2 class="text-2xl font-bold mb-2">Booking your ticket...</h2>
        </div>

        <div id="result-screen" class="hidden px-6 py-10 min-h-screen bg-gray-50">
            <div class="text-center mb-6">
                <h1 id="r-title" class="text-3xl font-extrabold text-gray-900">Title</h1>
            </div>
            <div id="r-img-div" class="w-full aspect-square bg-cover bg-no-repeat rounded-2xl mx-auto shadow-inner border border-white/50 mb-6" style="background-size: 200%; background-position: 0% 0%;"></div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6">
                <p id="r-desc" class="text-gray-600 text-center mb-4"></p>
                <div class="bg-green-50 rounded-xl p-4 text-center">
                    <p class="text-xs text-green-400 font-bold mb-1">BEST MATCH</p>
                    <p id="r-match" class="font-bold text-green-700"></p>
                </div>
            </div>
            <div class="space-y-3 mb-8">
                <button onclick="location.href='index.html'" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-md">🏠 Go to Lobby</button>
            </div>
        </div>
    </div>

    <script>
        let userGender = '';
        const questions = [
            { q: "Your dream hotel window view?", a: "Bright neon signs and high skyscrapers.", b: "Endless ocean and calm pine trees." },
            { q: "You found a famous restaurant with a huge line.", a: "Wait 2 hours if it's the hottest trend.", b: "Skip it and find a quiet local hidden gem." },
            { q: "When talking to locals during travel?", a: "Love it when they treat me warmly like family.", b: "Prefer polite distance and my own privacy." },
            { q: "Your perfect evening activity?", a: "Shopping and clubbing until late night.", b: "A peaceful walk along the beach or river." },
            { q: "What's your travel pace?", a: "Packed schedule! 10 places a day.", b: "Chill and go with the flow. No stress." }
        ];
        
        const resultsData = {
            F: [
                { id: "f1", title: "🏙️ Chic Seoulite", desc: "Trendy and modern. You love exploring hidden cafes in the busy city.", match: "Gangwon Healer" },
                { id: "f2", title: "🌊 Passionate Busan-er", desc: "Energetic and warm-hearted. You enjoy the mix of city vibes and the ocean.", match: "Jeolla Foodie" },
                { id: "f3", title: "🍚 Warm Jeolla Foodie", desc: "You value deep traditions and the absolute best food in the country.", match: "Passionate Busan-er" },
                { id: "f4", title: "🌲 Gangwon Healer", desc: "Peaceful nature lover. You find yourself in quiet beaches and pine forests.", match: "Chic Seoulite" }
            ],
            M: [
                { id: "m1", title: "🏙️ Urban Seoulite", desc: "Fast-paced and ambitious. The city lights fuel your energy.", match: "Gangwon Healer" },
                { id: "m2", title: "🌊 Dynamic Busan-er", desc: "Loyal and energetic. You thrive in the loud, lively coastal city.", match: "Jeolla Foodie" },
                { id: "m3", title: "🍚 Authentic Jeolla Foodie", desc: "You seek genuine connections and the richest traditional flavors.", match: "Dynamic Busan-er" },
                { id: "m4", title: "🌲 Gangwon Explorer", desc: "Calm and collected. You prefer driving coastal roads and hiking.", match: "Urban Seoulite" }
            ]
        };

        let currentQ = 0; let score = 0;

        function selectGender(g) {
            userGender = g;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            document.getElementById('q-title').innerText = questions[currentQ].q;
            document.getElementById('btn-a').innerText = questions[currentQ].a;
            document.getElementById('btn-b').innerText = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else {
                document.getElementById('question-screen').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                setTimeout(() => showResult(userGender === 'F' ? `f${(score % 4) + 1}` : `m${(score % 4) + 1}`), 2000);
            }
        }

        function showResult(resultId) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const result = resultsData[userGender].find(r => r.id === resultId);
            
            document.getElementById('r-title').innerText = result.title;
            document.getElementById('r-desc').innerText = result.desc;
            document.getElementById('r-match').innerText = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_city_soul_w.png')" : "url('k_city_soul_m.png')";
            
            const posArray = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"];
            imgDiv.style.backgroundPosition = posArray[resultsData[userGender].findIndex(r => r.id === resultId)];
        }
    </script>
</body>
</html>
