        // 데이터 확장 (5가지 분석, 오피스 생존 테마에 맞춘 심층 텍스트)
        const resultsData = {
            F: [
                { 
                    id: "f1", 
                    title: "🏃‍♀️ The 6 PM Fairy<br><span class='text-lg font-bold text-gray-500'>칼퇴 요정</span>", 
                    overview: "You are the absolute master of modern work-life balance and psychological boundaries. You maintain a strict, unwavering segregation between your professional labor and your personal identity, treating the corporate world exactly for what it is: a business transaction. You do exactly what you are paid to do with remarkable efficiency, but the absolute second the clock strikes 6:00 PM, your corporate persona completely powers down. You fundamentally refuse to sacrifice your personal happiness, physical health, or private weekends for the vague promise of corporate glory. You are the pioneer of the 'quiet quitting' generation, performing perfectly during business hours but vigorously protecting your off-the-clock peace.<br><br><span class='text-xs opacity-80'>당신은 현대의 워라밸과 심리적 경계 설정의 절대적인 마스터입니다. 직장 내 노동과 개인의 자아 정체성을 엄격하고 흔들림 없이 철저하게 분리하며, 회사 생활을 철저한 비즈니스 계약 관계로 인식합니다. 급여를 받는 만큼의 업무를 놀라운 효율성으로 정확히 해내지만, 시계가 정확히 오후 6시를 가리키는 순간 당신의 직장인 페르소나는 완전히 전원을 종료합니다. 모호한 회사의 영광이나 막연한 승진을 위해 개인의 행복, 육체적 건강, 또는 사적인 주말을 희생하는 것을 근본적으로 전면 거부합니다. 근무 시간 중에는 완벽하게 성과를 내지만 퇴근 후의 평화는 맹렬하게 지켜내는, 진정한 의미의 현대적 직장인의 표본이자 선구자입니다.</span>", 
                    strengths: "Your absolutely greatest strength is your hyper-efficient, razor-sharp time management. Because you intensely value your exit time, you drastically minimize useless small talk, avoid procrastinating, and accomplish eight hours of work in half the time. You suffer absolutely zero boundary fatigue and are highly immune to the chronic, soul-crushing corporate burnout that destroys your overly ambitious peers. Your clear, unwavering standards mean you are highly dependable during working hours; colleagues know exactly what to expect from you. You possess an exceptionally healthy mindset, knowing that a company is just a part of life, not the entirety of it.<br><br><span class='text-xs opacity-80'>당신의 절대적으로 가장 위대한 강점은 고도로 효율적이고 날카로운 시간 관리 능력입니다. 퇴근 시간을 그 무엇보다 강렬하게 소중히 여기기 때문에, 쓸데없는 잡담을 극적으로 최소화하고 미루는 습관을 없애며 8시간의 업무를 그 절반의 시간 만에 해치워버립니다. 당신은 경계가 무너져 생기는 피로감이 전혀 없으며, 지나치게 야심 찬 동료들을 파괴하는 만성적이고 영혼을 갉아먹는 직장 내 번아웃에 완벽한 면역력을 가지고 있습니다. 명확하고 흔들림 없는 기준 덕분에 근무 시간 내에는 고도로 신뢰할 수 있으며, 동료들은 당신에게 무엇을 기대할 수 있는지 정확히 알고 있습니다. 회사는 인생의 아주 작은 일부일 뿐 결코 전부가 아니라는, 예외적으로 건강한 사고방식을 소유하고 있습니다.</span>", 
                    relationship: "In the office, you maintain a highly polite, entirely professional, and cleanly distant relationship with your coworkers. You actively avoid toxic workplace gossip, emotionally draining office politics, and forced after-hours socializing (Hoesik). You are friendly and collaborative during team meetings, but you firmly draw the line at becoming 'family' with your department. You prefer solitary, restorative lunch breaks to recharge your social battery. While some might mistake your strict boundaries for aloofness, you actually respect your colleagues immensely by strictly honoring their time and expecting them to respectfully honor yours in return.<br><br><span class='text-xs opacity-80'>사무실에서 당신은 동료들과 매우 예의 바르고, 전적으로 프로페셔널하며, 깔끔하게 거리를 두는 관계를 유지합니다. 유독한 직장 내 뒷담화, 감정적으로 소모적인 사내 정치, 그리고 강압적인 퇴근 후 회식을 적극적으로 회피합니다. 팀 회의 중에는 친근하고 협력적이지만, 부서 사람들과 '가족' 같은 끈끈한 관계가 되는 것에는 단호하게 선을 긋습니다. 방전된 사회적 배터리를 재충전하기 위해 혼자만의 고요하고 회복적인 점심시간을 압도적으로 선호합니다. 누군가는 당신의 엄격한 경계선을 차가움이나 무관심으로 오해할 수 있지만, 사실 당신은 동료들의 시간을 엄격하게 존중하고 그 대가로 그들 역시 당신의 시간을 예의 바르게 존중해 주기를 기대하는 가장 깔끔한 동료입니다.</span>", 
                    weaknesses: "By aggressively enforcing absolute zero vulnerability and strictly refusing to participate in any informal network alliances, you run a massive risk of severe organizational alienation. In heavily traditional Korean corporate cultures, your complete absence from after-hours socializing can easily lead to you being entirely overlooked for critical promotions or highly lucrative project assignments. Because you view work purely as a transaction, you might actively miss out on discovering genuine, fulfilling passion in your career. Additionally, your rigid refusal to occasionally pitch in during genuine team emergencies can permanently damage your reputation, branding you as fundamentally selfish.<br><br><span class='text-xs opacity-80'>자신의 취약성을 드러내는 것을 절대적으로 차단하고 공식적인 업무 외의 네트워킹 참여를 엄격하게 거부함으로써, 당신은 심각한 조직적 소외라는 거대한 위험에 직면하게 됩니다. 몹시 보수적이고 전통적인 한국의 기업 문화에서, 퇴근 후 사교 모임에 완전히 불참하는 당신의 태도는 중요한 승진 기회나 매우 이윤이 남는 핵심 프로젝트 배정에서 당신을 완전히 배제시키는 결과를 초래할 수 있습니다. 업무를 순수한 거래로만 보기 때문에, 커리어에서 진정으로 충만하고 의미 있는 열정을 발견할 기회를 스스로 적극적으로 놓쳐버릴 수 있습니다. 또한, 팀에 닥친 진짜 위기 상황에서조차 가끔씩 손을 보태는 것을 경직되게 거부한다면 당신의 평판은 영구적으로 손상되어 근본적으로 이기적인 사람으로 낙인찍힐 수 있습니다.</span>", 
                    wellness: "To successfully survive the corporate jungle without severely compromising your precious boundaries or completely sabotaging your career, you must strategically master the art of 'visible flexibility'. You don't have to attend every single team dinner, but purposefully attending just one major gathering a quarter will dramatically soften your image and build crucial political capital. Be explicitly vocal and highly visible about the immense efficiency you bring during your working hours; make absolutely sure your boss knows exactly how much you accomplish by 6 PM. Most importantly, use your fiercely protected free time to build a robust, fulfilling identity completely separate from your job title.<br><br><span class='text-xs opacity-80'>당신의 소중한 경계선을 심각하게 타협하거나 커리어를 완전히 망치지 않으면서 이 살벌한 직장 정글에서 성공적으로 살아남으려면, '눈에 보이는 유연성'이라는 전략적 기술을 반드시 마스터해야 합니다. 모든 회식에 참석할 필요는 전혀 없지만, 분기에 한 번 정도 열리는 가장 중요한 주요 모임에만 의도적으로 참석해도 당신의 이미지를 극적으로 부드럽게 만들고 필수적인 정치적 자본을 구축할 수 있습니다. 근무 시간 동안 당신이 발휘하는 엄청난 업무 효율성에 대해 명시적으로 목소리를 내고 가시적으로 어필하십시오. 당신이 오후 6시까지 얼마나 많은 성과를 완벽히 달성하는지 상사가 정확히 인지하도록 만들어야 합니다. 가장 중요한 것은, 맹렬하게 지켜낸 여가 시간을 활용하여 직함과는 완전히 분리된 견고하고 충만한 개인의 정체성을 구축하는 것입니다.</span>", 
                    match: "Social Butterfly<br><span class='text-[10px] font-normal'>눈치 100단 처세술</span>"

        function generateSlug(titleHtml) {
            const englishPart = titleHtml.split('<br>')[0];
            return englishPart.replace(/[^a-zA-Z0-9 ]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
        }

        window.onload = () => {
            const hash = window.location.hash;
            const match = hash.match(/#\/result\/([a-zA-Z0-9-]+)/);
            
            if(match) {
                const currentSlug = match[1];
                let foundGender = '';
                let foundId = '';
                
                for(let g of ['F', 'M']) {
                    for(let i=0; i<resultsData[g].length; i++) {
                        if(generateSlug(resultsData[g][i].title) === currentSlug) {
                            foundGender = g;
                            foundId = g.toLowerCase() + (i + 1);
                            break;
                        }
                    }
                }
                
                if(foundId) {
                    userGender = foundGender;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    showResult(foundId, true); 
                }
            }
        };

        // 안전한 화면 전환 로직 (flex 속성 충돌 방지)

            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(toId).classList.remove('hidden');
        }

        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";

            qScreen.classList.remove('fade-in');

            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }

            if(val === 0) score++;

                showQuestion();
            } else {
                switchScreen('question-screen', 'loading-screen');
                const finalIdx = score % 4; 
                const genId = userGender === 'F' ? `f${finalIdx + 1}` : `m${finalIdx + 1}`;
                setTimeout(() => showResult(genId, false), 2500);
            }
        }
