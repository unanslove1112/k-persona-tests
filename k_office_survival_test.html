<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Office Survival Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3466039113171143" crossorigin="anonymous"></script>
    <style>
        /* 부드러운 페이드인 애니메이션 */
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg overflow-hidden relative">
        
        <!-- 1. START SCREEN -->
        <div id="start-screen" class="px-6 py-12 text-center min-h-screen flex flex-col justify-center bg-gradient-to-b from-gray-100 to-white fade-in">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-4 tracking-tight">K-Office Survival</h1>
            <p class="text-gray-600 mb-8 font-medium">
                What is your Korean corporate persona?<br><br>
                <span class="text-sm text-gray-400">당신의 K-직장인 페르소나는?</span>
            </p>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-8">
                <h2 class="text-xl font-bold mb-4">Step 1: Select Gender</h2>
                <div class="flex gap-4">
                    <button onclick="selectGender('M')" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-5 rounded-xl shadow-sm transition-all active:scale-95">👨 Male</button>
                    <button onclick="selectGender('F')" class="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold py-5 rounded-xl shadow-sm transition-all active:scale-95">👩 Female</button>
                </div>
            </div>
        </div>

        <!-- 2. QUESTION SCREEN -->
        <div id="question-screen" class="hidden px-6 py-12 min-h-screen flex flex-col">
            <div class="w-full bg-gray-100 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-gray-800 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex-1 flex flex-col justify-center fade-in">
                <h2 id="q-title" class="text-xl font-bold text-gray-800 mb-8 leading-relaxed"></h2>
                <div class="space-y-4">
                    <button onclick="answer(0)" id="btn-a" class="w-full text-left bg-gray-50 hover:bg-gray-100 border border-gray-200 p-5 rounded-xl shadow-sm leading-relaxed transition-all active:scale-95"></button>
                    <button onclick="answer(1)" id="btn-b" class="w-full text-left bg-gray-50 hover:bg-gray-100 border border-gray-200 p-5 rounded-xl shadow-sm leading-relaxed transition-all active:scale-95"></button>
                </div>
            </div>
        </div>

        <!-- 3. LOADING SCREEN -->
        <div id="loading-screen" class="hidden px-6 py-12 text-center min-h-screen flex flex-col justify-center items-center bg-gray-800 text-white">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-white mb-6"></div>
            <h2 class="text-2xl font-bold mb-2">
                Scanning ID card...<br><br>
                <span class="text-lg opacity-70">사원증 스캔 중...</span>
            </h2>
        </div>

        <!-- 4. RESULT SCREEN (프리미엄 리포트 UI) -->
        <div id="result-screen" class="hidden px-4 md:px-6 py-10 min-h-screen bg-slate-50">
            <div class="w-full bg-white rounded-[2rem] shadow-xl p-6 relative overflow-hidden ring-1 ring-gray-100 fade-in">
                
                <div class="text-center mb-6">
                    <span class="inline-block px-3 py-1 bg-gray-100 text-gray-600 text-[10px] font-black uppercase tracking-widest rounded-full mb-2">Analysis Complete</span>
                    <h1 id="r-title" class="text-2xl font-extrabold text-gray-900 leading-tight"></h1>
                </div>

                <div id="r-img-div" class="w-full aspect-square bg-gray-100 bg-cover bg-no-repeat rounded-[1.5rem] shadow-inner mb-6" style="background-size: 200% 200%; background-position: 0% 0%;"></div>

                <!-- 전문 심리 분석 리포트 섹션 -->
                <div id="r-desc" class="space-y-4 mb-6"></div>

                <!-- 찰떡 궁합 섹션 -->
                <div class="flex items-center justify-between bg-gray-900 rounded-2xl p-4 text-white mb-8 shadow-md">
                    <span class="text-[10px] font-bold opacity-60 uppercase tracking-widest">BEST CO-WORKER</span>
                    <span id="r-match" class="font-bold text-sm tracking-tight text-right"></span>
                </div>

                <!-- 광고 영역 -->
                <div class="mb-8 text-center bg-gray-50 rounded-xl border border-dashed border-gray-300 p-2 min-h-[100px] flex items-center justify-center">
                    <ins class="adsbygoogle"
                         style="display:block; width:100%;"
                         data-ad-client="ca-pub-3466039113171143"
                         data-ad-slot="여기에_슬롯ID_입력"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
                </div>

                <!-- 연관 테스트 추천 섹션 -->
                <div class="border-t border-gray-100 pt-6 mb-6">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center mb-4">Recommended K-Tests</p>
                    <div id="r-recommendations" class="grid grid-cols-2 gap-3">
                        <button onclick="location.href='k_aesthetic_test.html'" class="w-full text-left bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl shadow-sm transition-all flex flex-col items-center justify-center">
                            <span class="text-2xl mb-1">💄</span>
                            <span class="font-bold text-xs text-gray-800">Aesthetic</span>
                        </button>
                        <button onclick="location.href='k_drama_archetype_test.html'" class="w-full text-left bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl shadow-sm transition-all flex flex-col items-center justify-center">
                            <span class="text-2xl mb-1">🎬</span>
                            <span class="font-bold text-xs text-gray-800">K-Drama</span>
                        </button>
                    </div>
                </div>

                <button onclick="location.href='index.html'" class="w-full py-4 bg-gray-900 text-white font-bold rounded-xl shadow-md transition-all active:scale-95 text-sm">
                    🏠 Go to Lobby
                </button>
            </div>
        </div>
    </div>

    <script>
        let userGender = '';
        let currentQ = 0; 
        let score = 0;

        // 질문 데이터 (Bilingual 통합 및 미적 태그 적용)
        const questions = [
            { 
                q: "It's 5:50 PM. Your boss gives you a new task.<br><br><span class='text-sm text-gray-400 font-normal'>오후 5시 50분, 상사가 새로운 업무를 주었다.</span>", 
                a: "Assess the deadline, finish it fast, and leave on time.<br><br><span class='text-sm text-gray-500 font-normal'>마감일을 묻고, 빨리 끝낸 후 칼퇴한다.</span>", 
                b: "Work overtime to finish it perfectly today.<br><br><span class='text-sm text-gray-500 font-normal'>어차피 할 일, 야근해서라도 오늘 완벽히 끝낸다.</span>" 
            },
            { 
                q: "A sudden team dinner (Hoesik) is announced for tonight.<br><br><span class='text-sm text-gray-400 font-normal'>오늘 저녁 갑작스러운 팀 회식이 잡혔다.</span>", 
                a: "Politely decline and go home to rest.<br><br><span class='text-sm text-gray-500 font-normal'>정중하게 거절하고 집에 가서 쉰다.</span>", 
                b: "Go and use it to build relationships with the team.<br><br><span class='text-sm text-gray-500 font-normal'>참석해서 팀원들과 친목을 다진다.</span>" 
            },
            { 
                q: "During a meeting, the boss suggests a highly inefficient idea.<br><br><span class='text-sm text-gray-400 font-normal'>회의 중, 상사가 비효율적인 아이디어를 낸다.</span>", 
                a: "Quietly accept it to avoid conflict.<br><br><span class='text-sm text-gray-500 font-normal'>피곤해지기 싫어서 그냥 조용히 넘어간다.</span>", 
                b: "Politely suggest a better, more efficient alternative.<br><br><span class='text-sm text-gray-500 font-normal'>더 나은 대안을 정중하지만 확실하게 제시한다.</span>" 
            },
            { 
                q: "How do you usually spend your lunch break?<br><br><span class='text-sm text-gray-400 font-normal'>당신의 점심시간 루틴은?</span>", 
                a: "Eating alone or resting at my desk.<br><br><span class='text-sm text-gray-500 font-normal'>혼자 조용히 밥을 먹거나 자리에서 쉰다.</span>", 
                b: "Going out to a nice restaurant with colleagues.<br><br><span class='text-sm text-gray-500 font-normal'>동료들과 맛집을 찾아다니며 수다를 떤다.</span>" 
            },
            { 
                q: "A coworker texts you about work on a Saturday.<br><br><span class='text-sm text-gray-400 font-normal'>주말에 직장 동료에게 업무 카톡이 왔다.</span>", 
                a: "Ignore it until Monday morning.<br><br><span class='text-sm text-gray-500 font-normal'>월요일 아침 출근 전까지 절대 안 본다.</span>", 
                b: "Reply quickly to clear my mind of pending work.<br><br><span class='text-sm text-gray-500 font-normal'>찝찝하니까 일단 빨리 답장해서 해결한다.</span>" 
            }
        ];
        
        // 결과 데이터 (전문 심리 리포트 포맷, Bilingual 통합)
        const resultsData = {
            F: [
                { 
                    id: "f1", 
                    title: "🏃‍♀️ The 6 PM Fairy<br><span class='text-lg font-bold text-gray-500'>칼퇴 요정</span>", 
                    overview: "You maintain a strict psychological segregation between professional labor and personal identity. You treat work as a transaction.<br><br><span class='text-xs opacity-80'>직장 내 노동과 개인의 자아 정체성을 완벽하게 분리하는 철저한 현실주의자입니다. 업무를 명확한 계약 관계로 인지합니다.</span>", 
                    strengths: "Hyper-efficient time management. You suffer zero boundary fatigue because you protect your restorative periods.<br><br><span class='text-xs opacity-80'>압도적인 시간 관리 능력을 갖추고 있습니다. 사적인 휴식 시간을 완벽히 보호하기 때문에 번아웃에 빠지지 않고 꾸준한 효율을 냅니다.</span>", 
                    weaknesses: "You risk organizational alienation. By showing zero vulnerability, you miss out on informal network alliances.<br><br><span class='text-xs opacity-80'>공식적인 업무 외의 네트워킹을 차단하기 때문에, 조직 내에서 이기적이라는 평판을 받거나 중요한 승진 기회에서 소외될 수 있습니다.</span>", 
                    match: "Social Butterfly<br><span class='text-[10px] font-normal'>눈치 100단 처세술</span>" 
                },
                { 
                    id: "f2", 
                    title: "🔥 Passionate Hustler<br><span class='text-lg font-bold text-gray-500'>열정 만수르</span>", 
                    overview: "Driven by high instrumental motivation, you view the corporate hierarchy as a strategic arena to test your potential.<br><br><span class='text-xs opacity-80'>강한 야망과 목표 지향적 자아를 지녔습니다. 회사를 단순히 돈을 버는 곳이 아니라 자신의 능력을 증명하는 전략적 무대로 여깁니다.</span>", 
                    strengths: "Unstoppable grit and charismatic vision. You excel under tight timelines and push lagging teams into active overdrive.<br><br><span class='text-xs opacity-80'>위기 상황에서 더욱 빛을 발하는 강력한 돌파력이 있습니다. 높은 비전으로 부하 직원들을 이끄는 탁월한 리더십을 발휘합니다.</span>", 
                    weaknesses: "You micromanage everything. Your impatience with slower colleagues can foster toxic friction and destroy team morale.<br><br><span class='text-xs opacity-80'>통제 성향 때문에 남에게 일을 맡기지 못하고 스스로를 갈아 넣습니다. 속도가 느린 동료를 참지 못해 사내 마찰을 빚기 쉽습니다.</span>", 
                    match: "Hidden Master<br><span class='text-[10px] font-normal'>조용한 은둔형 고수</span>" 
                },
                { 
                    id: "f3", 
                    title: "💬 Social Butterfly<br><span class='text-lg font-bold text-gray-500'>눈치 100단 처세술</span>", 
                    overview: "You possess high social adaptability. You anchor your job stability within political capital and structural consensus.<br><br><span class='text-xs opacity-80'>조직 내 역학 관계를 본능적으로 파악하는 촉을 지녔습니다. 사내 정치와 인간관계를 유연하게 활용하여 갈등을 예방하는 네트워커입니다.</span>", 
                    strengths: "Masterful persuasion and the ability to turn cold contacts into lifelong tactical business alliances.<br><br><span class='text-xs opacity-80'>적을 만들지 않는 부드러운 친화력이 무기입니다. 부서 간 협업을 원활하게 이끌어내는 윤활유 같은 존재입니다.</span>", 
                    weaknesses: "By constantly shifting opinions to please superiors, you compromise your professional integrity and authority.<br><br><span class='text-xs opacity-80'>모두에게 좋은 사람이 되려다 정작 중요한 순간에 자기 의견을 내지 못하는 기회주의자로 비칠 수 있으며, 거절을 못해 잡무를 떠맡습니다.</span>", 
                    match: "The 6 PM Fairy<br><span class='text-[10px] font-normal'>칼퇴 요정</span>" 
                },
                { 
                    id: "f4", 
                    title: "🥷 Hidden Master<br><span class='text-lg font-bold text-gray-500'>조용한 은둔형 고수</span>", 
                    overview: "You find professional comfort in structural solutions and technical authority rather than team socialization.<br><br><span class='text-xs opacity-80'>드러나지 않는 기술적 전문성과 묵묵한 책임감을 중요시하는 에이스입니다. 복잡한 문제를 혼자 깊게 파고들어 해결할 때 쾌감을 느낍니다.</span>", 
                    strengths: "Flawless analytical depth and quiet problem-solving competence. You are the structural anchor of the department.<br><br><span class='text-xs opacity-80'>위기가 터져도 조용하고 냉정하게 수습합니다. 감정 낭비가 전혀 없는 든든한 요새이자 대체 불가능한 실력자입니다.</span>", 
                    weaknesses: "Your lack of self-promotion means your hard work becomes a free resource exploited by louder peers.<br><br><span class='text-xs opacity-80'>성과를 어필하는 능력이 심각하게 부족합니다. 얌체 같은 동료에게 공로를 뺏기거나 승진 및 연봉 협상에서 불이익을 받기 쉽습니다.</span>", 
                    match: "Passionate Hustler<br><span class='text-[10px] font-normal'>열정 만수르</span>" 
                }
            ]
        };
        // 남성 데이터를 여성 데이터와 구조 동일하게 복제 후 타이틀 수정
        resultsData.M = JSON.parse(JSON.stringify(resultsData.F));
        resultsData.M[0].title = "🏃‍♂️ The 6 PM Pro<br><span class='text-lg font-bold text-gray-500'>칼퇴 요정</span>";
        resultsData.M[1].title = "🔥 Ambitious Hustler<br><span class='text-lg font-bold text-gray-500'>열정 만수르</span>";
        resultsData.M[2].title = "🤝 Master of Networking<br><span class='text-lg font-bold text-gray-500'>눈치 100단 처세술</span>";
        resultsData.M[3].title = "🥷 Silent Ace<br><span class='text-lg font-bold text-gray-500'>조용한 은둔형 고수</span>";

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(fromId).classList.remove('flex');
            
            const toScreen = document.getElementById(toId);
            toScreen.classList.remove('hidden');
            toScreen.classList.add('flex');
        }

        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }

        function showQuestion() {
            // 진행바 애니메이션
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            
            // 질문 및 답변 적용 (innerHTML 사용하여 HTML 태그 렌더링)
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in');
            void qScreen.offsetWidth; // 트리거 리플로우 (애니메이션 재시작)
            qScreen.classList.add('fade-in');

            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            
            if(currentQ < questions.length) {
                showQuestion();
            } else {
                switchScreen('question-screen', 'loading-screen');
                // 기존 사용자 요청 로직: score 계산식 그대로 유지
                const finalIdx = score % 4; 
                setTimeout(() => showResult(userGender === 'F' ? `f${finalIdx + 1}` : `m${finalIdx + 1}`), 2500);
            }
        }

        function showResult(resultId) {
            switchScreen('loading-screen', 'result-screen');
            
            const idx = parseInt(resultId.replace(/[fm]/g, '')) - 1;
            const result = resultsData[userGender][idx];
            
            document.getElementById('r-title').innerHTML = result.title;
            document.getElementById('r-match').innerHTML = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_office_survival_w.png')" : "url('k_office_survival_m.png')";
            imgDiv.style.backgroundPosition = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"][idx];
            
            // 프리미엄 리포트 UI 렌더링
            document.getElementById('r-desc').innerHTML = `
                <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2 flex items-center gap-1">💡 Overview</h4>
                    <p class="text-sm text-indigo-900 leading-relaxed font-medium">${result.overview}</p>
                </div>
                <div class="bg-emerald-50 p-5 rounded-2xl border border-emerald-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-2 flex items-center gap-1">✨ Strengths</h4>
                    <p class="text-sm text-emerald-900 leading-relaxed font-medium">${result.strengths}</p>
                </div>
                <div class="bg-rose-50 p-5 rounded-2xl border border-rose-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-rose-600 uppercase tracking-widest mb-2 flex items-center gap-1">🎯 Fact Check</h4>
                    <p class="text-sm text-rose-900 leading-relaxed font-medium">${result.weaknesses}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
