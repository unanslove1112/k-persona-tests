                    relationship: "In highly intimate circles, you operate as the ultimate, deeply devoted caregiver, constantly showering your friends and heavily cherished partners with incredibly unconditional, sunny warmth. You fundamentally build relationships on deeply shared romantic ideals, sweet, meaningful gifts, and deeply affirming emotional exchanges. You aggressively abhor heavily dramatic, highly toxic conflicts and consistently strive to create heavily harmonious, perfectly beautiful dynamics where everyone feels comfortably coddled in your profoundly soft, highly emotional pastel universe.\n\n<span class='text-xs opacity-80'>가장 친밀한 관계 내에서 당신은 무한히 헌신하는 궁극의 치유자로 행동하며, 친구들과 깊이 아끼는 파트너에게 믿을 수 없을 만큼 무조건적이고 햇살 같은 따스함을 끊임없이 쏟아붓습니다. 낭만적인 이상주의를 깊이 공유하고, 달콤하고 의미 있는 선물을 주고받으며, 감정을 따뜻하게 긍정하는 교류를 바탕으로 근본적인 관계를 굳건히 구축합니다. 파국으로 치닫는 유해하고 몹시 극적인 갈등을 격렬하게 혐오하며, 모든 사람이 당신의 한없이 부드럽고 감성적인 파스텔톤 우주 속에서 편안하게 보호받고 있다고 느끼는, 완벽하게 조화롭고 눈부시게 아름다운 관계의 역학을 만들기 위해 일관되게 노력합니다.</span>",
                    weaknesses: "Because you so heavily filter out the harsh, aggressively cold, systematic truths of reality, you frequently fall into incredibly deep, heavily paralyzing melancholy when real life violently breaks your carefully constructed aesthetic fantasies. Your intense fear of destroying your beautiful, peaceful bubble often heavily prevents you from addressing deeply necessary, heavily uncomfortable realities. You can be severely hurt by even the slightest, heavily unintentional coldness from others, often internalizing minor aesthetic disruptions as highly massive emotional rejections.\n\n<span class='text-xs opacity-80'>현실의 가혹하고 공격적일 만큼 차가운 구조적인 진실들을 지나치게 강력하게 필터링해버리기 때문에, 거친 현실이 당신이 세심하게 공들여 쌓아 올린 미적 환상을 폭력적으로 산산조각 낼 때 종종 믿을 수 없을 만큼 깊고 마비될 정도의 극심한 우울감에 빠지곤 합니다. 당신의 아름답고 평화로운 환상의 거품을 터뜨리는 것에 대한 강렬한 두려움은, 종종 심오하게 필요하지만 몹시 불편한 현실의 문제들을 직면하는 것을 심각하게 방해합니다. 타인의 아주 사소하고 전혀 의도치 않은 작은 차가움에도 치명적인 상처를 입으며, 종종 사소한 미적 균열조차 감정적으로 엄청난 거절을 당한 것으로 무겁게 내면화하는 유리 멘탈의 성향이 있습니다.</span>", 
                    wellness: "To effectively heal your frequently bruised, deeply romantic heart without entirely losing your highly beautiful softness, you must intensely lean into extremely comforting, deeply tactile, offline activities. Engaging completely in heavily slow-paced, deeply sensory hobbies—like precisely arranging fresh, highly vibrant spring flowers, patiently baking deeply sweet pastries from scratch, or simply lying heavily wrapped in completely plush blankets while watching deeply classic romance films—will perfectly restore your heavily depleted emotional reserves.\n\n<span class='text-xs opacity-80'>툭하면 멍드는 당신의 깊고 낭만적인 심장을, 당신이 가진 그 찬란하고 아름다운 부드러움을 완전히 잃지 않으면서 효과적으로 치유하기 위해서는 극도로 편안하고 깊은 촉각을 자극하는 오프라인 활동에 강렬하게 기대야만 합니다. 눈부시게 생생한 봄꽃들을 세심하게 다듬어 꽃꽂이를 하거나, 인내심을 가지고 달콤한 베이킹을 처음부터 끝까지 직접 해내거나, 그저 폭신하고 두꺼운 담요에 몸을 칭칭 감은 채 오래된 고전 로맨스 영화를 넋을 놓고 바라보는 등 고도로 감각적이고 느린 템포의 취미에 온전히 몰입하는 것은 바닥나버린 당신의 감정적 에너지를 완벽하게 회복시켜 줄 것입니다.</span>",
                    match: "Hongdae Grunge<br><span class='text-[10px] font-normal'>홍대 그런지 락시크</span>"

        // 남성형 데이터 복사 및 매칭 텍스트 수정
        resultsData.M = JSON.parse(JSON.stringify(resultsData.F));
        resultsData.M[0].title = "🎸 Hongdae Grunge<br><span class='text-lg font-bold text-slate-500'>홍대 그런지 락시크</span>";
        resultsData.M[1].title = "🛹 Seongsu Gorpcore<br><span class='text-lg font-bold text-slate-500'>성수 고프고어 스트리트</span>";
        resultsData.M[2].title = "🍸 Gangnam Classic<br><span class='text-lg font-bold text-slate-500'>강남 댄디 클래식</span>";
        resultsData.M[3].title = "🦢 Hannam Preppy<br><span class='text-lg font-bold text-slate-500'>한남동 시티보이 남친룩</span>";
        
        resultsData.M[0].match = "Hannam Preppy<br><span class='text-[10px] font-normal'>한남동 시티보이 남친룩</span>";
        resultsData.M[1].match = "Gangnam Classic<br><span class='text-[10px] font-normal'>강남 댄디 클래식</span>";
        resultsData.M[2].match = "Seongsu Gorpcore<br><span class='text-[10px] font-normal'>성수 고프고어 스트리트</span>";
        resultsData.M[3].match = "Hongdae Grunge<br><span class='text-[10px] font-normal'>홍대 그런지 락시크</span>";

        // 캐릭터의 타이틀에서 영문 부분만 추출하여 URL용 슬러그 자동 생성
        function generateSlug(titleHtml) {
            const englishPart = titleHtml.split('<br>')[0];
            return englishPart.replace(/[^a-zA-Z0-9 ]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
        }

        // 페이지가 열릴 때 주소창의 해시(#) 값을 읽어서 해당 결과 화면을 띄워줌
        window.onload = () => {
            const hash = window.location.hash;
            const match = hash.match(/#\/result\/([a-zA-Z0-9-]+)/);
            
            if(match) {
                const currentSlug = match[1];
                let foundGender = '';
                let foundId = '';
                
                for(let g of ['F', 'M']) {
                    for(let i=0; i<resultsData[g].length; i++) {
                        if(generateSlug(resultsData[g][i].title) === currentSlug) {
                            foundGender = g;
                            foundId = g.toLowerCase() + (i + 1);
                            break;
                        }
                    }
                }
                
                if(foundId) {
                    userGender = foundGender;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    showResult(foundId, true); 
                }
            }
        };

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(toId).classList.remove('hidden');
        }

        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in');
            void qScreen.offsetWidth; 
            qScreen.classList.add('fade-in');

            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            
            if(currentQ < questions.length) {
                showQuestion();
            } else {
                switchScreen('question-screen', 'loading-screen');
                const finalIdx = score % 4; 
                const genId = userGender === 'F' ? `f${finalIdx + 1}` : `m${finalIdx + 1}`;
                setTimeout(() => showResult(genId, false), 2500);
            }
        }

        function showResult(resultId, isDirectLoad = false) {
            currentResultId = resultId;
            const idx = parseInt(resultId.replace(/[fm]/g, '')) - 1;
            const result = resultsData[userGender][idx];
            
            const slug = generateSlug(result.title);
            
            if(!isDirectLoad) {
                switchScreen('loading-screen', 'result-screen');
                // 해시(Hash) 방식으로 URL을 갱신하여 404 에러 원천 차단
                window.location.hash = "/result/" + slug;
            }
            
            document.getElementById('r-title').innerHTML = result.title;
            document.getElementById('r-match').innerHTML = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_aesthetic_w.png')" : "url('k_aesthetic_m.png')";
            imgDiv.style.backgroundPosition = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"][idx];
            
            document.getElementById('r-desc').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-pink-50 p-5 rounded-2xl border border-pink-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-pink-700 uppercase tracking-widest mb-2 flex items-center gap-1">💡 Overview (총평)</h4>
                        <p class="text-sm text-pink-900 leading-relaxed font-medium whitespace-pre-line">${result.overview}</p>
                    </div>
                    <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-indigo-700 uppercase tracking-widest mb-2 flex items-center gap-1">✨ Strengths (핵심 강점)</h4>
                        <p class="text-sm text-indigo-900 leading-relaxed font-medium whitespace-pre-line">${result.strengths}</p>
                    </div>
                    <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-blue-700 uppercase tracking-widest mb-2 flex items-center gap-1">🤝 Relationship (관계 스타일)</h4>
                        <p class="text-sm text-blue-900 leading-relaxed font-medium whitespace-pre-line">${result.relationship}</p>
                    </div>
                    <div class="bg-rose-50 p-5 rounded-2xl border border-rose-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-rose-700 uppercase tracking-widest mb-2 flex items-center gap-1">🎯 Fact Check (주의점)</h4>
                        <p class="text-sm text-rose-900 leading-relaxed font-medium whitespace-pre-line">${result.weaknesses}</p>
                    </div>
                    <div class="bg-teal-50 p-5 rounded-2xl border border-teal-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-teal-700 uppercase tracking-widest mb-2 flex items-center gap-1">🔋 Wellness (힐링 가이드)</h4>
                        <p class="text-sm text-teal-900 leading-relaxed font-medium whitespace-pre-line">${result.wellness}</p>
                    </div>
                </div>
            `;
        }

        function shareResult() {
            const idx = parseInt(currentResultId.replace(/[fm]/g, '')) - 1;
            const slug = generateSlug(resultsData[userGender][idx].title);
            
            // 현재 실행 중인 파일의 절대 경로에 해시를 이어붙여서 완벽한 링크 생성
            const shareUrl = window.location.origin + window.location.pathname + '#/result/' + slug;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('결과 링크가 복사되었습니다!\\n친구들에게 공유해보세요. 🚀');
            }).catch(err => {
                console.error('Copy failed', err);
                alert('링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요.');
            });
        }

        function goLobby() {
            window.location.href = 'https://k-persona-tests.vercel.app/';
        }
    </script>
