<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Aesthetic Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3466039113171143"
     crossorigin="anonymous"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3466039113171143" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg overflow-hidden relative">
        <div id="start-screen" class="px-6 py-12 text-center min-h-screen flex flex-col justify-center bg-gradient-to-b from-pink-50 to-white">
            <h1 class="text-4xl font-extrabold text-pink-500 mb-4 tracking-tight">K-Aesthetic</h1>
            <p class="text-gray-600 mb-8 font-medium">Find your Seoul styling vibe.</p>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-pink-100 mb-8">
                <h2 class="text-xl font-bold mb-4">Step 1: Select Your Gender</h2>
                <div class="flex gap-4">
                    <button onclick="selectGender('M')" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-4 rounded-xl shadow-sm">👨 Male</button>
                    <button onclick="selectGender('F')" class="flex-1 bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold py-4 rounded-xl shadow-sm">👩 Female</button>
                </div>
            </div>
        </div>

        <div id="question-screen" class="hidden px-6 py-12 min-h-screen flex flex-col">
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-pink-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex-1 flex flex-col justify-center">
                <h2 id="q-title" class="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">Question text</h2>
                <div class="space-y-4">
                    <button onclick="answer(0)" id="btn-a" class="w-full text-left bg-gray-50 hover:bg-pink-50 border border-gray-200 hover:border-pink-300 p-5 rounded-xl shadow-sm"></button>
                    <button onclick="answer(1)" id="btn-b" class="w-full text-left bg-gray-50 hover:bg-pink-50 border border-gray-200 hover:border-pink-300 p-5 rounded-xl shadow-sm"></button>
                </div>
            </div>
        </div>

        <div id="loading-screen" class="hidden px-6 py-12 text-center min-h-screen flex flex-col justify-center items-center bg-pink-500 text-white">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-white mb-6"></div>
            <h2 class="text-2xl font-bold mb-2">Finding your color...</h2>
        </div>

        <div id="result-screen" class="hidden px-6 py-10 min-h-screen bg-gray-50">
            <div class="text-center mb-6">
                <h1 id="r-title" class="text-3xl font-extrabold text-gray-900">Title</h1>
            </div>
            <div id="r-img-div" class="w-full aspect-square bg-cover bg-no-repeat rounded-2xl mx-auto shadow-inner border border-white/50 mb-6" style="background-size: 200%; background-position: 0% 0%;"></div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6">
                <p id="r-desc" class="text-gray-600 text-center mb-4"></p>
                <div class="bg-pink-50 rounded-xl p-4 text-center">
                    <p class="text-xs text-pink-400 font-bold mb-1">BEST MATCH</p>
                    <p id="r-match" class="font-bold text-pink-700"></p>
                </div>
            </div>
            
            <div class="mb-6 text-center">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-3466039113171143"
                     data-ad-slot="여기에_슬롯ID_입력"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
            </div>

            <div class="space-y-3 mb-8">
                <button onclick="location.href='index.html'" class="w-full bg-pink-500 text-white font-bold py-4 rounded-xl shadow-md">🏠 Go to Lobby</button>
            </div>
        </div>
    </div>

    <script>
        let userGender = '';
        const questions = [
            { q: "Saturday afternoon coffee?", a: "A hidden monochrome chic cafe.", b: "A bright cafe with giant ribbon cakes." },
            { q: "Your daily look base?", a: "Oversized blazer and wide pants.", b: "Fitted crop top and tennis skirt." },
            { q: "Your Instagram feed vibe?", a: "Flash photography and blurry night pics.", b: "Sunny brunch and floral aesthetics." },
            { q: "Favorite accessory?", a: "Chunky silver rings and chains.", b: "Pearl necklaces and cute hairbows." },
            { q: "Walking down the street, you listen to...", a: "Trendy R&B or Hip-hop beats.", b: "Upbeat K-Pop or acoustic pop." }
        ];
        
        const resultsData = {
            F: [
                { id: "f1", title: "🎸 Hongdae Indie", desc: "Black, silver accessories, and effortlessly cool.", match: "Hannam Old Money" },
                { id: "f2", title: "🛹 Seongsu Streetwear", desc: "Trendy, gorpcore, mixing vintage with high fashion.", match: "Gangnam Chic" },
                { id: "f3", title: "🍸 Gangnam Chic", desc: "Clean lines, neutral tones, modern and sophisticated.", match: "Seongsu Streetwear" },
                { id: "f4", title: "🦢 Hannam Old Money", desc: "Tweed jackets, pearls, elegant and romantic like an idol off-duty.", match: "Hongdae Indie" }
            ],
            M: [
                { id: "m1", title: "🎸 Hongdae Grunge", desc: "Leather jackets, silver rings, dark and moody.", match: "Hannam Preppy" },
                { id: "m2", title: "🛹 Seongsu Gorpcore", desc: "Nylon pants, layered tech-wear, trendy.", match: "Gangnam Classic" },
                { id: "m3", title: "🍸 Gangnam Classic", desc: "Tailored slacks, crisp shirts, flawless hair.", match: "Seongsu Gorpcore" },
                { id: "m4", title: "🦢 Hannam Preppy", desc: "Knit sweaters, gentle glasses, soft boyfriend look.", match: "Hongdae Grunge" }
            ]
        };

        let currentQ = 0; let score = 0;

        function selectGender(g) {
            userGender = g;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            document.getElementById('q-title').innerText = questions[currentQ].q;
            document.getElementById('btn-a').innerText = questions[currentQ].a;
            document.getElementById('btn-b').innerText = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else {
                document.getElementById('question-screen').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                setTimeout(() => showResult(userGender === 'F' ? `f${(score % 4) + 1}` : `m${(score % 4) + 1}`), 2000);
            }
        }

        function showResult(resultId) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const result = resultsData[userGender].find(r => r.id === resultId);
            
            document.getElementById('r-title').innerText = result.title;
            document.getElementById('r-desc').innerText = result.desc;
            document.getElementById('r-match').innerText = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_aesthetic_w.png')" : "url('k_aesthetic_m.png')";
            
            const posArray = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"];
            imgDiv.style.backgroundPosition = posArray[resultsData[userGender].findIndex(r => r.id === resultId)];
        }
    </script>
</body>
</html>
