<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Dating Style Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3466039113171143" crossorigin="anonymous"></script>
    <style>
        /* 부드러운 페이드인 애니메이션 추가 */
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg overflow-hidden relative">
        
        <!-- 1. START SCREEN -->
        <div id="start-screen" class="px-6 py-12 text-center min-h-screen flex flex-col justify-center bg-gradient-to-b from-rose-50 to-white fade-in">
            <h1 class="text-4xl font-extrabold text-rose-600 mb-4 tracking-tight">K-Dating Style</h1>
            <p class="text-gray-600 mb-8 font-medium">
                Discover your hidden romance vibe.<br><br>
                <span class="text-sm text-gray-400">나의 숨겨진 연애 세포는?</span>
            </p>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-rose-100 mb-8">
                <h2 class="text-xl font-bold mb-4">Step 1: Select Gender</h2>
                <div class="flex gap-4">
                    <button onclick="selectGender('M')" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-5 rounded-xl shadow-sm transition-all active:scale-95">👨 Male</button>
                    <button onclick="selectGender('F')" class="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold py-5 rounded-xl shadow-sm transition-all active:scale-95">👩 Female</button>
                </div>
            </div>
        </div>

        <!-- 2. QUESTION SCREEN -->
        <div id="question-screen" class="hidden px-6 py-12 min-h-screen flex flex-col">
            <div class="w-full bg-gray-100 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-rose-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex-1 flex flex-col justify-center fade-in">
                <h2 id="q-title" class="text-xl font-bold text-gray-800 mb-8 leading-relaxed"></h2>
                <div class="space-y-4">
                    <button onclick="answer(0)" id="btn-a" class="w-full text-left bg-gray-50 hover:bg-rose-50 border border-gray-200 p-5 rounded-xl shadow-sm leading-relaxed transition-all active:scale-95"></button>
                    <button onclick="answer(1)" id="btn-b" class="w-full text-left bg-gray-50 hover:bg-rose-50 border border-gray-200 p-5 rounded-xl shadow-sm leading-relaxed transition-all active:scale-95"></button>
                </div>
            </div>
        </div>

        <!-- 3. LOADING SCREEN -->
        <div id="loading-screen" class="hidden px-6 py-12 text-center min-h-screen flex flex-col justify-center items-center bg-rose-500 text-white">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-white mb-6"></div>
            <h2 class="text-2xl font-bold mb-2">
                Checking chemistry...<br><br>
                <span class="text-lg opacity-80 font-normal">연애 세포 분석 중...</span>
            </h2>
        </div>

        <!-- 4. RESULT SCREEN (프리미엄 리포트 UI) -->
        <div id="result-screen" class="hidden px-4 md:px-6 py-10 min-h-screen bg-slate-50">
            <div class="w-full bg-white rounded-[2rem] shadow-xl p-6 relative overflow-hidden ring-1 ring-gray-100 fade-in">
                
                <!-- 배경 장식 (로즈 테마) -->
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-rose-100 rounded-full blur-3xl opacity-50"></div>
                
                <div class="relative z-10">
                    <div class="text-center mb-6">
                        <span class="inline-block px-3 py-1 bg-rose-50 text-rose-600 text-[10px] font-black uppercase tracking-widest rounded-full mb-2">Analysis Complete</span>
                        <h1 id="r-title" class="text-2xl font-extrabold text-gray-900 leading-tight"></h1>
                    </div>

                    <div id="r-img-div" class="w-full aspect-square bg-gray-100 bg-cover bg-no-repeat rounded-[1.5rem] shadow-inner mb-6 border border-white/50" style="background-size: 200% 200%; background-position: 0% 0%;"></div>

                    <!-- 전문 심리 분석 리포트 섹션 (JS에서 주입) -->
                    <div id="r-desc" class="space-y-4 mb-6"></div>

                    <!-- 찰떡 궁합 섹션 -->
                    <div class="flex items-center justify-between bg-rose-900 rounded-2xl p-4 text-white mb-8 shadow-md">
                        <span class="text-[10px] font-bold opacity-70 uppercase tracking-widest">SOULMATE MATCH</span>
                        <span id="r-match" class="font-bold text-sm tracking-tight text-right"></span>
                    </div>

                    <!-- 광고 영역 -->
                    <div class="mb-6 text-center bg-gray-50 rounded-xl border border-dashed border-gray-300 p-2 min-h-[100px] flex items-center justify-center">
                        <ins class="adsbygoogle"
                             style="display:block; width:100%;"
                             data-ad-client="ca-pub-3466039113171143"
                             data-ad-slot="여기에_슬롯ID_입력"
                             data-ad-format="auto"
                             data-full-width-responsive="true"></ins>
                        <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
                    </div>

                    <button onclick="location.href='index.html'" class="w-full py-4 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95 text-sm">
                        🏠 Go to Lobby
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userGender = '';
        let currentQ = 0; 
        let score = 0;

        // 질문 데이터 (깔끔한 HTML 태그를 이용한 한영 혼용 포맷)
        const questions = [
            { 
                q: "You meet someone totally your type at a cafe!<br><br><span class='text-sm text-gray-400 font-normal'>카페에서 완전 내 이상형을 발견했다!</span>", 
                a: "Go straight up and ask for their Instagram.<br><br><span class='text-sm text-gray-500 font-normal'>바로 직진해서 인스타 아이디를 물어본다.</span>", 
                b: "Keep glancing at them, hoping for eye contact.<br><br><span class='text-sm text-gray-500 font-normal'>눈이 마주치길 바라며 계속 힐끔거린다.</span>" 
            },
            { 
                q: "Your partner hasn't replied to your text for 3 hours.<br><br><span class='text-sm text-gray-400 font-normal'>애인이 3시간째 카톡 답장이 없다면?</span>", 
                a: "Focus on my own work; they must be busy.<br><br><span class='text-sm text-gray-500 font-normal'>바쁜가 보다 하고 내 할 일에 집중한다.</span>", 
                b: "Check my phone constantly, wondering what's wrong.<br><br><span class='text-sm text-gray-500 font-normal'>무슨 일 있나 신경 쓰여서 폰만 계속 본다.</span>" 
            },
            { 
                q: "It's the weekend! What's the perfect date?<br><br><span class='text-sm text-gray-400 font-normal'>주말 데이트! 가장 완벽한 일정은?</span>", 
                a: "Exploring a new hot spot or an activity together.<br><br><span class='text-sm text-gray-500 font-normal'>새로운 핫플 투어나 활동적인 데이트를 한다.</span>", 
                b: "Chilling at home or a quiet cafe, just talking.<br><br><span class='text-sm text-gray-500 font-normal'>집이나 조용한 카페에서 오붓하게 대화한다.</span>" 
            },
            { 
                q: "You get into a big argument with your partner.<br><br><span class='text-sm text-gray-400 font-normal'>애인과 크게 다투었을 때, 당신의 대처는?</span>", 
                a: "Discuss the facts logically to find a solution.<br><br><span class='text-sm text-gray-500 font-normal'>논리적으로 원인을 파악하고 해결책을 찾는다.</span>", 
                b: "Address their hurt feelings first before analyzing.<br><br><span class='text-sm text-gray-500 font-normal'>잘잘못을 따지기 전에 상대의 감정을 먼저 달래준다.</span>" 
            },
            { 
                q: "How do you prepare for your 1-year anniversary?<br><br><span class='text-sm text-gray-400 font-normal'>1주년 기념일, 당신의 준비 방식은?</span>", 
                a: "Book a nice restaurant and pick a practical gift.<br><br><span class='text-sm text-gray-500 font-normal'>좋은 식당 예약과 실용적인 선물을 쿨하게 준비한다.</span>", 
                b: "Write a handwritten letter and plan a heartfelt surprise.<br><br><span class='text-sm text-gray-500 font-normal'>정성 가득한 손편지와 깜짝 이벤트를 준비한다.</span>" 
            }
        ];
        
        // 결과 데이터 (전문 심리 리포트 3단 분리 포맷 적용)
        const resultsData = {
            F: [
                { 
                    id: "f1", 
                    title: "🚜 The Confident Bulldozer<br><span class='text-lg font-bold text-gray-500'>직진 불도저</span>", 
                    overview: "Honest and bold! You don't play games. When you find someone you like, you pursue them with absolute clarity and honesty.<br><br><span class='text-xs opacity-80'>밀당은 없습니다! 마음에 드는 사람을 발견하면 재지 않고 절대적인 확신과 솔직함으로 직진하는 당당한 스타일입니다.</span>", 
                    strengths: "Your transparency builds deep trust. Partners never have to second-guess your feelings or intentions.<br><br><span class='text-xs opacity-80'>당신의 투명함은 관계에서 깊은 신뢰를 형성합니다. 연인이 당신의 마음이나 의도를 끊임없이 의심하고 추측할 필요가 없습니다.</span>", 
                    weaknesses: "Your high pacing might overwhelm cautious partners. Sometimes you need to adjust your speed to match theirs.<br><br><span class='text-xs opacity-80'>당신의 거침없는 속도는 조심스러운 상대에게 자칫 부담감을 줄 수 있습니다. 가끔은 상대방의 템포에 맞춰 속도를 조절하는 지혜가 필요합니다.</span>", 
                    match: "The Perfect Observer<br><span class='text-[10px] font-normal'>섬세한 관찰자</span>" 
                },
                { 
                    id: "f2", 
                    title: "👀 The Perfect Observer<br><span class='text-lg font-bold text-gray-500'>섬세한 관찰자</span>", 
                    overview: "You read the room perfectly. You express love through quiet, thoughtful actions rather than loud words.<br><br><span class='text-xs opacity-80'>눈치가 빠르고 분위기를 완벽하게 읽어냅니다. 요란하고 거창한 말보다는 조용하고 사려 깊은 행동으로 사랑을 표현하는 타입입니다.</span>", 
                    strengths: "You make your partner feel truly seen and deeply cared for in everyday moments through small details.<br><br><span class='text-xs opacity-80'>사소한 디테일을 놓치지 않는 배려심 덕분에, 연인은 일상 속에서 진정으로 이해받고 세심하게 사랑받고 있다고 느낍니다.</span>", 
                    weaknesses: "You might hide your own needs to maintain peace, leading to unspoken resentment over time.<br><br><span class='text-xs opacity-80'>평화를 유지하기 위해 정작 본인의 욕구는 꾹꾹 숨기는 경향이 있습니다. 이러다 보면 말하지 못한 서운함이 마음속에 쌓일 수 있습니다.</span>", 
                    match: "The Cool Analyst<br><span class='text-[10px] font-normal'>이성적인 분석가</span>" 
                },
                { 
                    id: "f3", 
                    title: "🧊 The Cool Analyst<br><span class='text-lg font-bold text-gray-500'>이성적인 분석가</span>", 
                    overview: "You seek a mature, stable partnership built on logic, mutual respect, and personal growth.<br><br><span class='text-xs opacity-80'>과도한 감정 소모를 싫어합니다. 상호 존중과 개인의 성장을 바탕으로 한 논리적이고 성숙하며 안정적인 관계를 추구합니다.</span>", 
                    strengths: "Excellent conflict resolution skills. You don't let temporary emotional drama ruin a fundamentally good relationship.<br><br><span class='text-xs opacity-80'>뛰어난 갈등 해결 능력을 지녔습니다. 일시적인 감정의 충돌이나 서운함 때문에 근본적으로 좋은 관계를 섣불리 망치지 않습니다.</span>", 
                    weaknesses: "Your partner might sometimes find you emotionally detached or too practical during sensitive moments.<br><br><span class='text-xs opacity-80'>무조건적인 공감이 필요한 예민한 순간에, 연인이 당신을 감정적으로 너무 메마르거나 지나치게 현실적이라고 느낄 수 있습니다.</span>", 
                    match: "The Confident Bulldozer<br><span class='text-[10px] font-normal'>직진 불도저</span>" 
                },
                { 
                    id: "f4", 
                    title: "💐 The True Romanticist<br><span class='text-lg font-bold text-gray-500'>헌신적인 로맨티스트</span>", 
                    overview: "Love is your top priority. You believe in fairytale romance and shower your partner with infinite affection.<br><br><span class='text-xs opacity-80'>사랑이 인생의 1순위입니다. 동화 같은 아름다운 로맨스를 굳게 믿으며, 연인에게 아낌없고 무한한 애정을 쏟아붓는 사랑꾼입니다.</span>", 
                    strengths: "You create an incredibly warm environment that makes your partner feel like the center of the universe.<br><br><span class='text-xs opacity-80'>연인이 마치 온 우주의 중심이 된 것처럼 특별하게 느끼도록 만들어 주는, 믿을 수 없이 따뜻하고 사랑스러운 환경을 조성합니다.</span>", 
                    weaknesses: "You risk losing your own identity in the relationship and getting easily hurt if your effort isn't matched.<br><br><span class='text-xs opacity-80'>연애에 너무 몰입한 나머지 본인만의 자아를 잃을 위험이 크며, 상대방의 노력이 내 기대에 미치지 못할 때 큰 상처를 받습니다.</span>", 
                    match: "The Cool Analyst<br><span class='text-[10px] font-normal'>이성적인 분석가</span>" 
                }
            ]
        };

        // 남성 데이터를 여성 데이터 구조와 동일하게 복사 후 타이틀 및 매치 수정
        resultsData.M = JSON.parse(JSON.stringify(resultsData.F));
        resultsData.M[0].title = "🚜 The Direct Bulldozer<br><span class='text-lg font-bold text-gray-500'>직진 불도저</span>";
        resultsData.M[1].title = "👀 The Gentle Observer<br><span class='text-lg font-bold text-gray-500'>섬세한 관찰자</span>";
        resultsData.M[2].title = "🧊 The Logical Analyst<br><span class='text-lg font-bold text-gray-500'>이성적인 분석가</span>";
        resultsData.M[3].title = "💐 The Ultimate Romantic<br><span class='text-lg font-bold text-gray-500'>헌신적인 로맨티스트</span>";
        
        resultsData.M[0].match = "The Gentle Observer<br><span class='text-[10px] font-normal'>섬세한 관찰자</span>";
        resultsData.M[1].match = "The Logical Analyst<br><span class='text-[10px] font-normal'>이성적인 분석가</span>";
        resultsData.M[2].match = "The Direct Bulldozer<br><span class='text-[10px] font-normal'>직진 불도저</span>";
        resultsData.M[3].match = "The Logical Analyst<br><span class='text-[10px] font-normal'>이성적인 분석가</span>";

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(fromId).classList.remove('flex');
            
            const toScreen = document.getElementById(toId);
            toScreen.classList.remove('hidden');
            toScreen.classList.add('flex');
        }

        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }

        function showQuestion() {
            // 진행바 애니메이션
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            
            // 페이드인 애니메이션 리셋
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in');
            void qScreen.offsetWidth; 
            qScreen.classList.add('fade-in');

            // innerHTML로 태그 렌더링 적용 (1번 파일 방식)
            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            
            if(currentQ < questions.length) {
                showQuestion();
            } else {
                switchScreen('question-screen', 'loading-screen');
                const finalIdx = score % 4; 
                setTimeout(() => showResult(userGender === 'F' ? `f${finalIdx + 1}` : `m${finalIdx + 1}`), 2500);
            }
        }

        function showResult(resultId) {
            switchScreen('loading-screen', 'result-screen');
            
            const idx = parseInt(resultId.replace(/[fm]/g, '')) - 1;
            const result = resultsData[userGender][idx];
            
            document.getElementById('r-title').innerHTML = result.title;
            document.getElementById('r-match').innerHTML = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_dating_style_w.png')" : "url('k_dating_style_m.png')";
            imgDiv.style.backgroundPosition = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"][idx];
            
            // 1번 파일과 동일한 3단 분석 UI 구성 (로즈 컬러 톤에 맞춘 배색)
            document.getElementById('r-desc').innerHTML = `
                <div class="bg-rose-50 p-5 rounded-2xl border border-rose-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-rose-700 uppercase tracking-widest mb-2 flex items-center gap-1">💡 Overview</h4>
                    <p class="text-sm text-rose-900 leading-relaxed font-medium">${result.overview}</p>
                </div>
                <div class="bg-pink-50 p-5 rounded-2xl border border-pink-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-pink-700 uppercase tracking-widest mb-2 flex items-center gap-1">✨ Strengths</h4>
                    <p class="text-sm text-pink-900 leading-relaxed font-medium">${result.strengths}</p>
                </div>
                <div class="bg-red-50 p-5 rounded-2xl border border-red-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-red-700 uppercase tracking-widest mb-2 flex items-center gap-1">🎯 Fact Check</h4>
                    <p class="text-sm text-red-900 leading-relaxed font-medium">${result.weaknesses}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
