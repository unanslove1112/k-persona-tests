                    strengths: "Your absolutely outstanding ability to remain completely emotionally detached allows you to be the ultimate, highly effective crisis manager. You can logically untangle the most incredibly complex problems, quickly identifying highly efficient, brilliant solutions that others miss due to sheer panic. You deeply respect the firm boundaries of others and fiercely protect your own, making you an incredibly low-drama, highly reliable individual. Your independence is an absolute superpower; you are highly self-sufficient, fiercely resourceful, and totally immune to the toxic, exhausting peer pressure that constantly derails others.<br><br><span class='text-xs opacity-80'>감정적으로 완전히 분리된 상태를 완벽하게 유지하는 당신의 압도적인 능력은, 당신을 궁극적이고 고도로 효과적인 위기 관리자로 만들어 줍니다. 극도의 패닉 상태에 빠진 다른 사람들이 놓치는 고도로 효율적이고 빛나는 해결책을 빠르게 식별하여, 믿을 수 없을 만큼 복잡하게 얽힌 문제들을 논리적으로 완벽하게 풀어낼 수 있습니다. 타인의 확고한 경계선을 깊이 존중하고 자신의 경계선을 맹렬하게 방어하여, 불필요한 드라마가 전혀 없는 매우 신뢰할 수 있는 사람입니다. 당신의 독립성은 절대적인 초능력과 같습니다. 스스로 자급자족하며, 놀라울 정도로 문제 해결 능력이 뛰어나고, 끊임없이 타인을 탈선시키는 유독하고 소모적인 또래 압력에 완전히 면역되어 있습니다.</span>",
                    relationship: "In relationships, you prioritize profound intellectual compatibility, absolute mutual respect, and massive amounts of independent personal space above all else. You explicitly express love through highly practical, extremely reliable acts—solving complex logistical problems, meticulously managing finances, or simply ensuring a perfectly functioning, drama-free life together. You are entirely put off by extreme emotional clinginess, irrational jealousy, or the desperate, exhausting need for constant verbal reassurance. You seek a formidable, equally independent partner who is completely self-assured and views the relationship as an incredibly highly functioning, strategic partnership rather than a messy emotional crutch.<br><br><span class='text-xs opacity-80'>관계에서 당신은 깊은 지적 호환성, 절대적인 상호 존중, 그리고 방대한 양의 독립적인 개인 공간을 그 무엇보다 우선시합니다. 복잡한 현실적 문제를 해결하거나, 꼼꼼하게 재정을 관리하거나, 단순히 완벽하게 기능하고 드라마 없는 공동의 삶을 보장하는 등 매우 실용적이고 극도로 신뢰할 수 있는 행동을 통해 명시적으로 사랑을 표현합니다. 극단적인 감정적 집착, 비이성적인 질투, 또는 끊임없는 언어적 확신을 절박하고 피곤하게 요구하는 행위를 철저히 배격합니다. 당신은 스스로에 대한 확신이 완전하며, 관계를 지저분한 감정적 목발이 아닌 믿을 수 없을 정도로 제 기능을 다하는 전략적 파트너십으로 바라보는 강력하고 동등하게 독립적인 파트너를 찾습니다.</span>",
                    weaknesses: "Your extreme, unyielding reliance on pure, cold logic means you can frequently appear highly intimidating, deeply indifferent, or completely unapproachable to those who desperately seek emotional warmth. You might dangerously invalidate the very real, complex emotions of others simply because they don't logically 'make sense' to your highly structured brain. In your intense pursuit of absolute independence, you severely risk total emotional isolation, completely failing to deeply connect with the highly irrational but beautifully profound aspects of the human experience. Furthermore, your incredibly high standards for perfection can easily make you overly critical and brutally dismissive.<br><br><span class='text-xs opacity-80'>순수하고 차가운 논리에 대한 극단적이고 타협 없는 의존은, 감정적인 따뜻함을 절실히 찾는 사람들에게 당신이 매우 위압적이거나 깊이 무관심하며 완전히 다가가기 힘든 사람으로 빈번하게 보이게 만듭니다. 다른 사람들의 매우 현실적이고 복잡한 감정들이 당신의 고도로 구조화된 두뇌에 논리적으로 '이치에 맞지 않는다'는 이유만으로 그 감정들을 위험하게 짓밟고 무효화할 수 있습니다. 절대적인 독립성을 향한 강렬한 추구 속에서, 인간 경험의 지극히 비이성적이지만 아름다울 정도로 심오한 측면과 깊이 교감하는 데 완전히 실패하여 완벽한 정서적 고립에 빠질 심각한 위험을 안고 있습니다. 나아가 완벽을 향한 믿을 수 없을 정도로 높은 기준은 당신을 지나치게 비판적이고 잔인할 정도로 냉정하게 만들 수 있습니다.</span>",
                    wellness: "To heavily counteract your dangerously rigid, overly analytical nature, you must proactively engage in highly sensory, purely expressive, and deeply 'messy' physical activities. Force yourself to participate in things that absolutely have no correct answer or logical structure—like highly abstract finger painting, absolutely spontaneous, unstructured dancing, or totally unmeasured, chaotic cooking. You must consciously, deliberately practice extending explicit verbal empathy before immediately trying to fix someone's problem. Learning to comfortably sit in the highly uncomfortable, utterly illogical space of raw human emotion without trying to 'solve' it will absolutely transform your deepest relationships.<br><br><span class='text-xs opacity-80'>위험할 정도로 경직되고 지나치게 분석적인 당신의 본성을 강력하게 상쇄하기 위해, 고도로 감각적이고 순수하게 표현적이며 매우 '지저분한' 육체적 활동에 선제적으로 참여해야 합니다. 극도로 추상적인 핑거 페인팅, 절대적으로 즉흥적이고 구조가 없는 춤, 혹은 계량하지 않은 혼란스러운 요리처럼 절대적인 정답이나 논리적 구조가 아예 없는 활동에 스스로를 강제로 참여시키십시오. 누군가의 문제를 즉각적으로 해결하려 들기 전에, 명시적이고 언어적인 공감을 먼저 건네는 연습을 의식적이고 의도적으로 수행해야 합니다. 날것 그대로의 인간 감정이라는, 매우 불편하고 완전히 비논리적인 공간에서 그것을 '해결'하려 들지 않고 그저 편안하게 머무르는 법을 배우는 것은 당신의 가장 깊은 관계들을 절대적으로 변화시킬 것입니다.</span>",

        function generateSlug(titleHtml) {
            const englishPart = titleHtml.split('<br>')[0];
            return englishPart.replace(/[^a-zA-Z0-9 ]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
        }

        window.onload = () => {
            const hash = window.location.hash;
            const match = hash.match(/#\/result\/([a-zA-Z0-9-]+)/);
            
            if(match) {
                const currentSlug = match[1];
                let foundGender = '';
                let foundId = '';
                
                for(let g of ['F', 'M']) {
                    for(let i=0; i<resultsData[g].length; i++) {
                        if(generateSlug(resultsData[g][i].title) === currentSlug) {
                            foundGender = g;
                            foundId = g.toLowerCase() + (i + 1);
                            break;
                        }
                    }
                }
                
                if(foundId) {
                    userGender = foundGender;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    showResult(foundId, true); 
                }
            }
        };

        // 안전한 화면 전환 로직 적용 (flex 속성 충돌 방지)
        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(toId).classList.remove('hidden');
        }

        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in');
            void qScreen.offsetWidth; 
            qScreen.classList.add('fade-in');

            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            
            if(currentQ < questions.length) {
                showQuestion();
            } else {
                switchScreen('question-screen', 'loading-screen');
                const finalIdx = score % 4; 
                const genId = userGender === 'F' ? `f${finalIdx + 1}` : `m${finalIdx + 1}`;
                setTimeout(() => showResult(genId, false), 2500);
            }
        }

        function shareResult() {
            const idx = parseInt(currentResultId.replace(/[fm]/g, '')) - 1;
            const slug = generateSlug(resultsData[userGender][idx].title);

            });
