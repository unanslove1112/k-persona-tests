<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Variety Persona Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3466039113171143" crossorigin="anonymous"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg overflow-hidden relative">
        
        <div id="start-screen" class="px-6 py-12 text-center min-h-screen flex flex-col justify-center bg-gradient-to-b from-yellow-50 to-white fade-in">
            <h1 class="text-4xl font-extrabold text-yellow-500 mb-4 tracking-tight">K-Variety Persona</h1>
            <p class="text-gray-600 mb-8 font-medium">
                Who are you in a Korean Variety Show?<br><br>
                <span class="text-sm text-gray-400">K-예능 속 당신의 찐 캐릭터는?</span>
            </p>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-yellow-100 mb-8">
                <h2 class="text-xl font-bold mb-4">Step 1: Select Gender</h2>
                <div class="flex gap-4">
                    <button onclick="selectGender('M')" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-5 rounded-xl shadow-sm transition-all active:scale-95">👨 Male</button>
                    <button onclick="selectGender('F')" class="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold py-5 rounded-xl shadow-sm transition-all active:scale-95">👩 Female</button>
                </div>
            </div>
        </div>

        <div id="question-screen" class="hidden px-6 py-12 min-h-screen flex flex-col">
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-yellow-400 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex-1 flex flex-col justify-center fade-in">
                <h2 id="q-title" class="text-xl font-bold text-gray-800 mb-8 leading-relaxed"></h2>
                <div class="space-y-4">
                    <button onclick="answer(0)" id="btn-a" class="w-full text-left bg-gray-50 hover:bg-yellow-50 border border-gray-200 p-5 rounded-xl shadow-sm leading-relaxed transition-all active:scale-95"></button>
                    <button onclick="answer(1)" id="btn-b" class="w-full text-left bg-gray-50 hover:bg-yellow-50 border border-gray-200 p-5 rounded-xl shadow-sm leading-relaxed transition-all active:scale-95"></button>
                </div>
            </div>
        </div>

        <div id="loading-screen" class="hidden px-6 py-12 text-center min-h-screen flex flex-col justify-center items-center bg-yellow-400 text-gray-900">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-gray-900 mb-6"></div>
            <h2 class="text-2xl font-bold mb-2">
                Rolling the cameras...<br><br>
                <span class="text-lg opacity-80 font-normal">카메라 롤링 중...</span>
            </h2>
        </div>

        <div id="result-screen" class="hidden px-4 md:px-6 py-10 min-h-screen bg-gray-50">
            <div class="w-full bg-white rounded-[2rem] shadow-xl p-6 relative overflow-hidden ring-1 ring-gray-100 fade-in">
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-yellow-100 rounded-full blur-3xl opacity-50"></div>
                <div class="relative z-10">
                    <div class="text-center mb-6">
                        <span class="inline-block px-3 py-1 bg-yellow-50 text-yellow-600 text-[10px] font-black uppercase tracking-widest rounded-full mb-2">Cast Member Profile</span>
                        <h1 id="r-title" class="text-2xl font-extrabold text-gray-900 leading-tight"></h1>
                    </div>
                    <div id="r-img-div" class="w-full aspect-square bg-gray-100 bg-cover bg-no-repeat rounded-[1.5rem] shadow-inner mb-6" style="background-size: 200% 200%; background-position: 0% 0%;"></div>
                    <div id="r-desc" class="space-y-4 mb-6"></div>
                    <div class="flex items-center justify-between bg-yellow-900 rounded-2xl p-4 text-white mb-8 shadow-md">
                        <span class="text-[10px] font-bold text-yellow-400 opacity-80 uppercase tracking-widest">BEST CHEMISTRY</span>
                        <span id="r-match" class="font-bold text-sm tracking-tight text-right"></span>
                    </div>
                    <div class="mb-6 text-center bg-gray-50 rounded-xl border border-dashed border-gray-300 p-2 min-h-[100px] flex items-center justify-center">
                        <ins class="adsbygoogle" style="display:block; width:100%;" data-ad-client="ca-pub-3466039113171143" data-ad-slot="여기에_슬롯ID_입력" data-ad-format="auto" data-full-width-responsive="true"></ins>
                        <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
                    </div>
                    <button onclick="location.href='index.html'" class="w-full py-4 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold rounded-xl shadow-md transition-all active:scale-95 text-sm">
                        🏠 Go to Lobby
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userGender = ''; let currentQ = 0; let score = 0;

        const questions = [
            { q: "Playing a survival game for a huge prize!<br><br><span class='text-sm text-gray-400 font-normal'>큰 상금이 걸린 생존 게임을 한다면?</span>", a: "I will betray my team at the last moment to win.<br><br><span class='text-sm text-gray-500 font-normal'>이기기 위해서라면 마지막 순간에 팀원을 배신한다.</span>", b: "I'll try to win honestly by working together.<br><br><span class='text-sm text-gray-500 font-normal'>팀원들과 협동하여 끝까지 정정당당하게 승부한다.</span>" },
            { q: "The PD points the camera directly at you!<br><br><span class='text-sm text-gray-400 font-normal'>PD가 당신에게 대놓고 카메라를 들이댄다!</span>", a: "Strike a funny pose or say something witty.<br><br><span class='text-sm text-gray-500 font-normal'>재밌는 포즈를 취하거나 웃긴 멘트를 던진다.</span>", b: "Hide shyly and tell them to film someone else.<br><br><span class='text-sm text-gray-500 font-normal'>부끄러워하며 다른 사람을 찍으라고 카메라를 피한다.</span>" },
            { q: "It's dinner time. The crew has to cook.<br><br><span class='text-sm text-gray-400 font-normal'>저녁 시간. 멤버들이 직접 요리를 해야 한다면?</span>", a: "Take charge of the kitchen and give orders.<br><br><span class='text-sm text-gray-500 font-normal'>주방의 지배자가 되어 요리를 주도하고 지시한다.</span>", b: "Quietly wash the ingredients and set the table.<br><br><span class='text-sm text-gray-500 font-normal'>조용히 재료를 씻고 수저를 놓으며 보조 역할을 한다.</span>" },
            { q: "A sudden scary mission in an abandoned school.<br><br><span class='text-sm text-gray-400 font-normal'>버려진 폐교에서 갑자기 담력 훈련을 한다면?</span>", a: "Scream perfectly for the camera reaction.<br><br><span class='text-sm text-gray-500 font-normal'>카메라 분량을 위해 세상 떠나가라 소리를 지른다.</span>", b: "Walk through calmly, using logic to find the exit.<br><br><span class='text-sm text-gray-500 font-normal'>귀신은 가짜라고 되뇌며 이성적으로 출구를 찾는다.</span>" },
            { q: "Finally resting at the basecamp...<br><br><span class='text-sm text-gray-400 font-normal'>드디어 베이스캠프에서의 휴식 시간...</span>", a: "Chatting non-stop and playing games until 3 AM.<br><br><span class='text-sm text-gray-500 font-normal'>새벽 3시까지 끊임없이 수다를 떨고 마피아 게임을 한다.</span>", b: "Falling asleep immediately in the corner.<br><br><span class='text-sm text-gray-500 font-normal'>구석에 조용히 누워 가장 먼저 잠에 빠져든다.</span>" }
        ];
        
        const resultsData = {
            F: [
                { id: "f1", title: "🦊 The Cunning Betrayer<br><span class='text-lg font-bold text-gray-500'>얍삽한 배신자캐</span>", overview: "Smart, witty, and highly entertaining. You know exactly how to create a dramatic twist for the viewers.<br><br><span class='text-xs opacity-80'>똑똑하고 재치가 넘칩니다. 시청자들을 위해 어떻게 극적인 반전을 만들어내야 하는지 본능적으로 알고 있습니다.</span>", strengths: "Incredible survival instincts, quick thinking, and you always secure your own screen time.<br><br><span class='text-xs opacity-80'>엄청난 생존 본능과 빠른 두뇌 회전. 치열한 분량 전쟁 속에서도 반드시 자신의 원샷을 챙겨가는 예능 천재입니다.</span>", weaknesses: "Nobody trusts you in games. You are the first target everyone wants to eliminate.<br><br><span class='text-xs opacity-80'>게임이 시작되면 아무도 당신을 믿지 않습니다. 항상 모두가 가장 먼저 탈락시키고 싶어 하는 공공의 적 1순위입니다.</span>", match: "The Brain Strategist<br><span class='text-[10px] font-normal'>브레인 지략가</span>" },
                { id: "f2", title: "🍀 The Unlucky Comedian<br><span class='text-lg font-bold text-gray-500'>불운의 꽝손</span>", overview: "Clumsy but incredibly lovable. The universe somehow conspires to make everything you do hilariously wrong.<br><br><span class='text-xs opacity-80'>어설프지만 지독하게 사랑스럽습니다. 우주의 기운이 당신을 향해 예능신을 강림시키며 웃음을 유발합니다.</span>", strengths: "Natural comedic timing. You don't even have to try to be funny; your bad luck does all the work.<br><br><span class='text-xs opacity-80'>타고난 예능감. 굳이 웃기려 노력하지 않아도 당신의 지독한 불운 자체가 최고의 예능 명장면을 만들어냅니다.</span>", weaknesses: "You always end up getting the penalty (like sleeping outdoors or drinking sour tea).<br><br><span class='text-xs opacity-80'>가위바위보 한 번을 해도 꼭 져서, 야외 취침이나 까나리 액젓 마시기 같은 벌칙은 항상 당신의 몫입니다.</span>", match: "The Quiet Eater<br><span class='text-[10px] font-normal'>평화로운 먹방러</span>" },
                { id: "f3", title: "🧠 The Brain Strategist<br><span class='text-lg font-bold text-gray-500'>브레인 지략가</span>", overview: "Calm, observant, and highly capable. You carry the team during difficult missions with your flawless logic.<br><br><span class='text-xs opacity-80'>차분하고 관찰력이 뛰어나며 능력치가 만렙입니다. 어려운 미션에서 완벽한 논리로 팀을 하드캐리하는 기둥입니다.</span>", strengths: "Excellent puzzle-solving skills, deep general knowledge, and unshakeable calmness.<br><br><span class='text-xs opacity-80'>뛰어난 퍼즐 해결 능력, 깊은 상식, 그리고 흔들리지 않는 평정심. 제작진이 숨겨둔 힌트도 귀신같이 찾아냅니다.</span>", weaknesses: "You can be too serious, sometimes ruining the comedic flow by solving things too easily.<br><br><span class='text-xs opacity-80'>예능에서 너무 다큐를 찍을 때가 있습니다. 문제를 너무 쉽게 풀어버려 제작진과 멤버들을 당황시키기도 합니다.</span>", match: "The Cunning Betrayer<br><span class='text-[10px] font-normal'>얍삽한 배신자캐</span>" },
                { id: "f4", title: "🐻 The Quiet Eater<br><span class='text-lg font-bold text-gray-500'>평화로운 먹방러</span>", overview: "Peaceful and easygoing. You avoid the drama and focus purely on eating and taking care of the crew.<br><br><span class='text-xs opacity-80'>평화롭고 느긋합니다. 시끄러운 배신과 게임에는 관심 없고, 오직 밥을 먹거나 멤버들을 챙기는 데 진심입니다.</span>", strengths: "Amazing cooking skills, high empathy, and providing genuine healing moments for the show.<br><br><span class='text-xs opacity-80'>놀라운 요리 실력과 높은 공감 능력을 가졌으며, 자극적인 예능 속에서 진정한 힐링 타임과 감동을 선사합니다.</span>", weaknesses: "Your screen time might be completely edited out unless it's a food-related segment.<br><br><span class='text-xs opacity-80'>밥 먹는 시간이나 요리하는 시간이 아니면, 리액션이 부족해 방송 분량이 통편집될 위험이 매우 높습니다.</span>", match: "The Unlucky Comedian<br><span class='text-[10px] font-normal'>불운의 꽝손</span>" }
            ]
        };
        resultsData.M = JSON.parse(JSON.stringify(resultsData.F));

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(toId).classList.remove('hidden');
            document.getElementById(toId).classList.add('flex');
        }
        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }
        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in'); void qScreen.offsetWidth; qScreen.classList.add('fade-in');
            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }
        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else {
                switchScreen('question-screen', 'loading-screen');
                setTimeout(() => showResult(userGender === 'F' ? `f${(score % 4) + 1}` : `m${(score % 4) + 1}`), 2500);
            }
        }
        function showResult(resultId) {
            switchScreen('loading-screen', 'result-screen');
            const idx = parseInt(resultId.replace(/[fm]/g, '')) - 1;
            const result = resultsData[userGender][idx];
            document.getElementById('r-title').innerHTML = result.title;
            document.getElementById('r-match').innerHTML = result.match;
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_variety_w.png')" : "url('k_variety_m.png')";
            imgDiv.style.backgroundPosition = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"][idx];
            
            document.getElementById('r-desc').innerHTML = `
                <div class="bg-yellow-50 p-5 rounded-2xl border border-yellow-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-yellow-600 uppercase tracking-widest mb-2 flex items-center gap-1">💡 Overview</h4>
                    <p class="text-sm text-yellow-900 leading-relaxed font-medium">${result.overview}</p>
                </div>
                <div class="bg-amber-50 p-5 rounded-2xl border border-amber-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-2 flex items-center gap-1">✨ Strengths</h4>
                    <p class="text-sm text-amber-900 leading-relaxed font-medium">${result.strengths}</p>
                </div>
                <div class="bg-lime-50 p-5 rounded-2xl border border-lime-100 shadow-sm">
                    <h4 class="text-[10px] font-black text-lime-700 uppercase tracking-widest mb-2 flex items-center gap-1">🎯 Fact Check</h4>
                    <p class="text-sm text-lime-900 leading-relaxed font-medium">${result.weaknesses}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
