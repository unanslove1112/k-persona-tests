                    title: "🐻 The Quiet Eater<br><span class='text-lg font-bold text-gray-500'>평화로운 힐링 먹방러</span>",

                    strengths: "Elite culinary instincts, high empathy, and a maternal/paternal aura that brings immense emotional healing to a chaotic, fast-paced show. You are the quiet soul and background pillar of the entire cast.<br><br><span class='text-xs opacity-80'>장인의 경지에 오른 요리 솜씨와 주변을 편안하게 감싸주는 따뜻한 힐링 아우라. 카메라가 꺼진 곳에서도 고생하는 스태프와 멤버들을 살뜰히 먹여 살리며 자극적인 예능 속에서 깊은 안정감과 감동을 자아냅니다.</span>", 
                    relationship: "The ultimate angel to 'The Unlucky Comedian.' You quietly pass them extra food or blankets after they suffer through a brutal penalty mission, cementing yourself as the most beloved member on the show.<br><br><span class='text-xs opacity-80'>벌칙에 당첨되어 하루 종일 굶고 구른 '불운의 꽝손'에게 제작진 몰래 고기를 구워 입에 넣어주거나 따뜻한 찌개를 챙겨주는 천사 같은 역할입니다. 모든 멤버가 진심으로 의지하고 사랑하는 호감형 캐릭터입니다.</span>", 
                    weaknesses: "Extremely low screen time during heavy action or athletic segments. If there is no food or resting period involved, your naturally quiet demeanor can easily cause you to be completely edited out.<br><br><span class='text-xs opacity-80'>음식이 없고 뜀박질만 하는 격렬한 액션 미션에서는 존재감이 공기처럼 희미해집니다. 특별한 리액션 없이 구석에서 가만히 구경만 하다가 분량이 통째로 가차 없이 날아가는 통편집의 위험이 매우 큽니다.</span>", 
                    weaknesses: "Extremely low screen time during heavy action or athletic segments. If there is no food or resting period involved, your naturally quiet demeanor can easily cause you to be completely edited out.<br><br><span class='text-xs opacity-80'>음식이 없고 뜀박질만 하는 격렬한 액션 미션에서는 존재감이 공기처럼 희미해집니다. 특별한 리액션 없이 구석에서 가만히 구경만 하다가 분량이 통째로 가차 없이 날아가는 통편집의 위험이 매우 큽니다.</span>", 
                    wellness: "Variety Survival Tip: Don't repress your hanger. When someone dares to steal your side dish or interrupts your nap, unleashing a sleepy, sharp, and realistic outburst of annoyance will shock the cast and easily steal the whole episode.<br><br><span class='text-xs opacity-80'>예능 생존 전략: 밥 먹는 걸 방해받았을 때 나오는 찐 분노나 나른한 투덜거림을 애써 참지 말고 카메라 앞에 그대로 노출하세요. 평화롭던 먹방러의 한 치의 타협 없는 단호한 잔소리는 그 어떤 무리수보다 강력한 꿀잼 분량을 터트립니다.</span>", 
                    match: "The Unlucky Comedian<br><span class='text-[10px] font-normal'>불운의 꽝손</span>" 
                }
            ]
        };

        // 남성 데이터도 완벽하게 구조 복제 적용
        resultsData.M = JSON.parse(JSON.stringify(resultsData.F));

        function generateSlug(titleHtml) {
            const englishPart = titleHtml.split('<br>')[0];
            return englishPart.replace(/[^a-zA-Z0-9 ]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
        }

        window.onload = () => {
            const hash = window.location.hash;
            const match = hash.match(/#\/result\/([a-zA-Z0-9-]+)/);
            
            if(match) {
                const currentSlug = match[1];
                let foundGender = '';
                let foundId = '';
                
                for(let g of ['F', 'M']) {
                    for(let i=0; i<resultsData[g].length; i++) {
                        if(generateSlug(resultsData[g][i].title) === currentSlug) {
                            foundGender = g;
                            foundId = g.toLowerCase() + (i + 1);
                            break;
                        }
                    }
                }
                
                if(foundId) {
                    userGender = foundGender;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    showResult(foundId, true); 
                }
            }
        };

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(toId).classList.remove('hidden');
            document.getElementById(toId).classList.add('flex');
        }
        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }
        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in'); void qScreen.offsetWidth; qScreen.classList.add('fade-in');
            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }
        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else {
                switchScreen('question-screen', 'loading-screen');
                setTimeout(() => showResult(userGender === 'F' ? `f${(score % 4) + 1}` : `m${(score % 4) + 1}`), 2500);
            }
        }
        function showResult(resultId, isDirectLoad = false) {
            currentResultId = resultId;
            const idx = parseInt(resultId.replace(/[fm]/g, '')) - 1;
            const result = resultsData[userGender][idx];
            const slug = generateSlug(result.title);
            
            if(!isDirectLoad) {
                switchScreen('loading-screen', 'result-screen');
                window.location.hash = "/result/" + slug;
            }
            
            document.getElementById('r-title').innerHTML = result.title;
            document.getElementById('r-match').innerHTML = result.match;
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_variety_w.png')" : "url('k_variety_m.png')";
            imgDiv.style.backgroundPosition = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"][idx];
            
            // 기존 옐로우/앰버/라임 디자인 테마에 맞추어 5단계 분석 카드 렌더링
            document.getElementById('r-desc').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-yellow-50 p-5 rounded-2xl border border-yellow-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-yellow-600 uppercase tracking-widest mb-2 flex items-center gap-1">💡 Overview (총평)</h4>
                        <p class="text-sm text-yellow-900 leading-relaxed font-medium">${result.overview}</p>
                    </div>
                    <div class="bg-amber-50 p-5 rounded-2xl border border-amber-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-2 flex items-center gap-1">✨ Strengths (핵심 강점)</h4>
                        <p class="text-sm text-amber-900 leading-relaxed font-medium">${result.strengths}</p>
                    </div>
                    <div class="bg-orange-50 p-5 rounded-2xl border border-orange-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-orange-600 uppercase tracking-widest mb-2 flex items-center gap-1">🤝 Relationship (예능 케미)</h4>
                        <p class="text-sm text-orange-900 leading-relaxed font-medium">${result.relationship}</p>
                    </div>
                    <div class="bg-lime-50 p-5 rounded-2xl border border-lime-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-lime-700 uppercase tracking-widest mb-2 flex items-center gap-1">🎯 Fact Check (주의점)</h4>
                        <p class="text-sm text-lime-900 leading-relaxed font-medium">${result.weaknesses}</p>
                    </div>
                    <div class="bg-emerald-50 p-5 rounded-2xl border border-emerald-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-emerald-700 uppercase tracking-widest mb-2 flex items-center gap-1">🔋 Wellness (예능 생존 전략)</h4>
                        <p class="text-sm text-emerald-900 leading-relaxed font-medium">${result.wellness}</p>
                    </div>
                </div>
            `;
        }

        function shareResult() {
            const idx = parseInt(currentResultId.replace(/[fm]/g, '')) - 1;
            const slug = generateSlug(resultsData[userGender][idx].title);
            const shareUrl = window.location.origin + window.location.pathname + '#/result/' + slug;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('🎬 예능 카메라 ON! 내 예능 캐릭터 프로필 링크가 복사되었습니다!\\n친구들에게 공유해서 꿀잼 케미를 매칭해보세요! 🚀');
            }).catch(err => {
                console.error('Copy failed', err);
                alert('링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요.');
            });
        }

        function goLobby() {
            window.location.href = 'https://k-persona-tests.vercel.app/';
        }
    </script>
