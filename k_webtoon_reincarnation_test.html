                    strengths: "Your combat prowess and strategic mind are unparalleled. Because you know the future, you never fall into traps, and you instantly recognize who will betray you and who will become a valuable ally. You possess an unbreakable mental fortitude, forged through the literal apocalypse. Your ability to exploit the 'System' to gain overpowered (OP) status makes you a one-person army. You don't rely on luck; every victory is carefully calculated. Your cold, competent demeanor naturally causes powerful beings, from guild masters to literal gods (Constellations), to obsess over sponsoring you.<br><br><span class='text-xs opacity-80'>당신의 전투 능력과 전략적 두뇌는 타의 추종을 불허합니다. 미래를 알고 있기 때문에 뻔한 함정에 결코 빠지지 않으며, 누가 내 뒤통수를 칠 배신자인지, 누가 미래에 엄청난 전력이 될 동료인지 첫눈에 완벽하게 꿰뚫어 봅니다. 문자 그대로의 종말을 겪으며 벼려진, 절대 부서지지 않는 강철 같은 정신력을 소유하고 있습니다. '시스템'의 허점을 집요하게 파고들어 압도적인 사기캐(OP)로 거듭나는 당신은 그 자체로 걸어 다니는 1인 군단입니다. 요행을 바라지 않으며, 모든 승리는 철저한 계산의 결과입니다. 특유의 차갑고 유능한 태도는 대형 길드장부터 하늘의 성좌(신)들까지 당신을 후원하고 싶어 안달 나게 만드는 치명적인 매력을 발산합니다.</span>",

                    wellness: "To retain your humanity, you must occasionally mute the 'System Window' and engage with the world without calculating EXP or item drop rates. Force yourself to participate in a trivial, completely non-combat related activity with your guildmates, like going out for an embarrassingly normal dinner or watching a movie. Practice communicating your traumatic past to at least one person, so you don't have to carry the weight of a destroyed timeline alone. Remember that surviving the apocalypse is meaningless if you lose your soul in the process; healing your mind is just as critical as leveling up your sword skills.<br><br><span class='text-xs opacity-80'>당신의 위태로운 인간성을 유지하기 위해서는, 가끔은 의도적으로 '시스템 창'을 음소거하고 경험치나 아이템 드랍률을 계산하지 않은 채 세상을 온전히 마주해야 합니다. 길드원들과 함께 전투와는 1%도 상관없는 몹시 사소하고 일상적인 활동—민망할 정도로 평범한 회식을 하거나 영화를 보는 것—에 억지로라도 참여하세요. 멸망해버린 시간선의 무거운 짐을 혼자 다 짊어지지 않도록, 당신의 끔찍했던 과거 트라우마를 단 한 사람에게라도 솔직하게 털어놓는 연습이 필요합니다. 아무리 종말에서 살아남고 복수에 성공한다 한들, 그 과정에서 당신의 영혼이 괴물로 변해버린다면 아무런 의미가 없다는 것을 기억하세요. 내면을 치유하는 것은 검술 레벨을 올리는 것만큼이나 치명적으로 중요합니다.</span>",

                    weaknesses: "Your pathological altruism is your biggest downfall. You suffer from a severe 'Messiah Complex,' readily sacrificing your own health, lifespan, and happiness to heal others, completely ignoring your own physical limits. Because you see the good in absolutely everyone, you are easily kidnapped, manipulated, or emotionally blackmailed by corrupt temples and fake families. Your extreme passivity forces the people who love you to constantly commit atrocities just to keep you safe from a world that constantly tries to exploit your pure nature.<br><br><span class='text-xs opacity-80'>병적인 수준의 이타심이 당신을 파멸로 이끄는 가장 큰 약점입니다. 심각한 '메시아 콤플렉스'를 앓고 있어, 타인을 치유하기 위해서라면 자신의 건강, 수명, 그리고 행복 따위는 기꺼이 깎아내며 자신의 육체적 한계를 철저히 무시합니다. 세상 모든 사람의 내면에 선함이 있다고 굳게 믿는 답답할 정도의 순진함 때문에, 타락한 신전이나 가짜 가족들에게 너무나 쉽게 납치당하고, 조종당하며, 감정적으로 착취당합니다. 당신의 그 극단적인 수동성과 백치미는, 당신의 순수한 본성을 끝없이 이용하려는 잔인한 세상으로부터 당신을 지키기 위해, 결국 당신을 사랑하는 사람들이 당신 몰래 끊임없는 학살과 악행을 저지르게 만드는 모순을 낳습니다.</span>",

        resultsData.M[2].strengths = "Your emotional stability and grounding aura are your absolute superpowers. You never flinch in the face of terrifying, blood-soaked Espers; instead, you treat their apocalyptic meltdowns like minor tantrums, expertly pulling them back to sanity with a firm, calming touch. You have an overwhelming capacity for empathy, intuitively understanding the intense pain hidden behind their violent outbursts. Your power doesn't rely on flashy swords or spells, yet you hold the leash to the strongest weapons in the empire. You command effortless respect, offering a profound sense of safety and home to those who have only known war and destruction.<br><br><span class='text-xs opacity-80'>당신의 바위 같은 정서적 안정감과 상대를 진정시키는 아우라는 그 무엇과도 바꿀 수 없는 절대적인 초능력입니다. 피를 뒤집어쓰고 살기를 뿜어내는 끔찍한 에스퍼 앞에서도 눈 하나 깜짝하지 않으며, 그들의 멸망급 폭주를 그저 어린애의 투정쯤으로 취급하며 단호하고 차분한 손길로 그들의 이성을 완벽하게 잡아끌어 올립니다. 그들의 폭력적인 겉모습 이면에 숨겨진 처절한 고통을 본능적으로 꿰뚫어 보는 압도적인 공감 능력을 지녔습니다. 당신의 힘은 화려한 검술이나 마법이 아니지만, 역설적으로 제국에서 가장 강력하고 위험한 인간 병기들의 목줄을 단단히 쥐고 통제합니다. 평생을 참혹한 전쟁과 파괴 속에서만 살아온 이들에게 영혼의 고향이자 완벽한 안전 지대를 제공하며, 애쓰지 않아도 자연스럽게 모두의 경외를 이끌어냅니다.</span>";
        resultsData.M[2].weaknesses = "Your extreme tolerance for the toxic behavior of your Espers means you constantly sacrifice your own boundaries. You treat your body like an unlimited battery pack for others, ignoring your severe fatigue until you literally collapse from guiding overload. Because your partners view you as their sole lifeline, their affection quickly morphs into terrifying, suffocating confinement; they will aggressively isolate you from the rest of the world out of intense jealousy and fear of losing you. Your inability to say 'no' traps you in a cycle of constantly managing other people's explosive emotional baggage at the cost of your own freedom.<br><br><span class='text-xs opacity-80'>에스퍼들의 유독하고 집착적인 행동을 한없이 받아주다 보니, 정작 당신 자신을 지켜야 할 최소한의 방어선마저 끊임없이 희생하고 내어주게 됩니다. 자신의 몸을 타인을 위한 무한 배터리 취급하며, 가이딩 과부하로 쓰러져 피를 토할 때까지 자신의 극심한 피로를 무식하게 방치합니다. 파트너들이 당신을 생명줄 그 자체로 여기기 때문에, 그들의 애정은 순식간에 숨 막히고 끔찍한 감금과 집착으로 변질되기 일쑤입니다. 당신을 잃을지도 모른다는 극도의 공포와 광적인 질투심에 휩싸인 그들은 당신을 세상으로부터 철저히 고립시키려 듭니다. 남의 부탁을 모질게 거절하지 못하는 그 성격 탓에, 결국 당신 자신의 자유를 산산조각 내면서까지 다른 이들의 폭발적인 감정 쓰레기를 영원히 수습해야 하는 가혹한 굴레에 갇히고 맙니다.</span>";

        resultsData.M[0].match = "Mysterious Mastermind<br><span class='text-[10px] font-normal'>흑막 엑스트라</span>";
        resultsData.M[1].match = "The Hidden Guide<br><span class='text-[10px] font-normal'>숨겨진 가이드</span>";
        resultsData.M[2].match = "The Max-Level Player<br><span class='text-[10px] font-normal'>만렙 회귀자</span>";
        resultsData.M[3].match = "Misunderstood Villain<br><span class='text-[10px] font-normal'>오해받는 악당</span>";

        function generateSlug(titleHtml) {
            const englishPart = titleHtml.split('<br>')[0];
            return englishPart.replace(/[^a-zA-Z0-9 ]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
        }

        window.onload = () => {
            const hash = window.location.hash;
            const match = hash.match(/#\/result\/([a-zA-Z0-9-]+)/);
            
            if(match) {
                const currentSlug = match[1];
                let foundGender = '';
                let foundId = '';
                
                for(let g of ['F', 'M']) {
                    for(let i=0; i<resultsData[g].length; i++) {
                        if(generateSlug(resultsData[g][i].title) === currentSlug) {
                            foundGender = g;
                            foundId = g.toLowerCase() + (i + 1);
                            break;
                        }
                    }
                }
                
                if(foundId) {
                    userGender = foundGender;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    showResult(foundId, true); 
                }
            }
        };

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(toId).classList.remove('hidden');
            document.getElementById(toId).classList.add('flex');
        }
        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }
        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in'); void qScreen.offsetWidth; qScreen.classList.add('fade-in');
            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }
        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else {
                switchScreen('question-screen', 'loading-screen');
                setTimeout(() => showResult(userGender === 'F' ? `f${(score % 4) + 1}` : `m${(score % 4) + 1}`), 2500);
            }
        }
        function showResult(resultId, isDirectLoad = false) {
            currentResultId = resultId;
            const idx = parseInt(resultId.replace(/[fm]/g, '')) - 1;
            const result = resultsData[userGender][idx];
            const slug = generateSlug(result.title);
            
            if(!isDirectLoad) {
                switchScreen('loading-screen', 'result-screen');
                window.location.hash = "/result/" + slug;
            }
            
            document.getElementById('r-title').innerHTML = result.title;
            document.getElementById('r-match').innerHTML = result.match;
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_webtoon_w.png')" : "url('k_webtoon_m.png')";
            imgDiv.style.backgroundPosition = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"][idx];
            
            // 프리미엄 리포트 UI 적용 (다크/레드 테마 5단 구성)
            document.getElementById('r-desc').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-slate-800/80 p-5 rounded-2xl border border-red-500/30 shadow-sm">
                        <h4 class="text-[10px] font-black text-red-400 uppercase tracking-widest mb-2 flex items-center gap-1">💡 Overview (총평)</h4>
                        <p class="text-sm text-slate-300 leading-relaxed font-medium">${result.overview}</p>
                    </div>
                    <div class="bg-slate-800/80 p-5 rounded-2xl border border-rose-500/30 shadow-sm">
                        <h4 class="text-[10px] font-black text-rose-400 uppercase tracking-widest mb-2 flex items-center gap-1">✨ Strengths (핵심 강점)</h4>
                        <p class="text-sm text-slate-300 leading-relaxed font-medium">${result.strengths}</p>
                    </div>
                    <div class="bg-slate-800/80 p-5 rounded-2xl border border-fuchsia-500/30 shadow-sm">
                        <h4 class="text-[10px] font-black text-fuchsia-400 uppercase tracking-widest mb-2 flex items-center gap-1">🤝 Relationship (관계 스타일)</h4>
                        <p class="text-sm text-slate-300 leading-relaxed font-medium">${result.relationship || (userGender === 'F' ? resultsData.F[idx].relationship : resultsData.F[idx].relationship.replace(/성녀/g, '가이드'))}</p>
                    </div>
                    <div class="bg-slate-800/80 p-5 rounded-2xl border border-orange-500/30 shadow-sm">
                        <h4 class="text-[10px] font-black text-orange-400 uppercase tracking-widest mb-2 flex items-center gap-1">🎯 Fact Check (주의점)</h4>
                        <p class="text-sm text-slate-300 leading-relaxed font-medium">${result.weaknesses}</p>
                    </div>
                    <div class="bg-slate-800/80 p-5 rounded-2xl border border-sky-500/30 shadow-sm">
                        <h4 class="text-[10px] font-black text-sky-400 uppercase tracking-widest mb-2 flex items-center gap-1">🔋 Wellness (힐링 가이드)</h4>
                        <p class="text-sm text-slate-300 leading-relaxed font-medium">${result.wellness || (userGender === 'F' ? resultsData.F[idx].wellness : resultsData.F[idx].wellness.replace(/성녀/g, '가이드'))}</p>
                    </div>
                </div>
            `;
            
            // 공통 사용 처리를 위한 빠른 Fallback 구조 세팅 (데이터 무결성 확보)
            if(!result.relationship) {
                 document.getElementById('r-desc').innerHTML = document.getElementById('r-desc').innerHTML.replace("undefined", resultsData.F[idx].relationship);
            }
            if(!result.wellness) {
                 document.getElementById('r-desc').innerHTML = document.getElementById('r-desc').innerHTML.replace("undefined", resultsData.F[idx].wellness);
            }
        }

        function shareResult() {
            const idx = parseInt(currentResultId.replace(/[fm]/g, '')) - 1;
            const slug = generateSlug(resultsData[userGender][idx].title);
            const shareUrl = window.location.origin + window.location.pathname + '#/result/' + slug;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('시스템 알림: 상태창 링크가 복사되었습니다!\\n동료들에게 공유하여 파티를 구성하세요. 🚀');
            }).catch(err => {
                console.error('Copy failed', err);
                alert('링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요.');
            });
        }

        function goLobby() {
            window.location.hash = ''; 
            window.location.reload();  
        }
    </script>
