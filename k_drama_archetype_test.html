        resultsData.M[2].overview = "You are the beautiful, highly educated, and agonizingly perfect second lead who exists only to make the audience cry. You are always there with an umbrella in the rain, a warm cup of tea, and a gentle smile that hides your shattered heart. You have loved the main character quietly for years, acting as her ultimate safe space and wisest counselor. You are wealthy but humble, brilliant but soft-spoken. You are practically flawless on paper, but your tragically polite nature means you are destined to watch the love of your life walk away with the rougher, more aggressive main lead.<br><br><span class='text-xs opacity-80'>당신은 오직 시청자들의 가슴을 찢어지게 만들기 위해 존재하는, 눈부시게 아름답고 고학력에 미치도록 완벽한 벤츠 서브 남주입니다. 비가 쏟아지는 날이면 언제나 말없이 우산을 씌워주고, 따뜻한 차 한 잔을 건네며, 산산조각 난 당신의 심장을 부드러운 미소 뒤에 완벽하게 숨깁니다. 수년 동안 그녀만을 조용히 바라보며 짝사랑해 왔고, 그녀가 세상에서 가장 안전하게 쉴 수 있는 도피처이자 가장 지혜로운 조언자 역할을 자처합니다. 돈이 많지만 겸손하고, 천재적이지만 다정하게 말합니다. 현실의 스펙으로 따지면 문자 그대로 흠잡을 데 없는 무결점 완벽남이지만, 그 비극적일 정도로 예의 바르고 배려심 넘치는 성격 탓에 결국 당신 인생의 유일한 사랑이 거칠고 공격적인 메인 남주인공의 손을 잡고 떠나가는 뒷모습을 그저 아련하게 지켜볼 수밖에 없는 잔인한 운명을 타고났습니다.</span>";

        resultsData.M[2].weaknesses = "Your fatal flaw is your paralyzing fear of crossing the line. You suffer deeply from 'Nice Guy Syndrome,' believing that being constantly polite and waiting patiently will automatically earn you romantic love. You fail to take bold, necessary action when it truly matters, continuously missing the crucial timing to confess your feelings. You act too much like a perfect guardian angel and not enough like a passionate lover, which ultimately firmly cements you in the inescapable friend-zone.<br><br><span class='text-xs opacity-80'>당신의 가장 치명적인 결함은 선을 넘는 것을 죽을 만큼 두려워하는 그 마비될 듯한 공포증입니다. 심각한 '착한 남자 신드롬'에 빠져 있어서, 그저 한결같이 예의 바르게 행동하고 묵묵히 기다리다 보면 언젠가 로맨틱한 사랑이 보상처럼 자연스럽게 주어질 것이라는 거대한 착각 속에 살고 있습니다. 진짜로 거칠게 밀어붙여야 할 결정적인 순간에 대담하고 필요한 행동을 취하지 못하고, 당신의 뜨거운 감정을 고백할 황금 같은 타이밍을 매번 속 터지게 날려버립니다. 당신은 피가 끓는 열정적인 연인이 아니라, 욕망이 거세된 완벽한 수호천사처럼 행동하기 때문에 결국 절대 빠져나올 수 없는 견고한 '좋은 오빠/친구' 구역에 스스로를 영원히 콘크리트로 발라버리는 꼴이 됩니다.</span>";

        resultsData.M[3].strengths = "Your unpretentious, straightforward nature is incredibly refreshing. You are fiercely loyal to your friends, ready to throw fists or look like an absolute fool to protect them. Your humor naturally diffuses high-tension situations, making you a deeply comforting presence. You possess a brilliant, street-smart emotional intelligence that instantly spots the romantic tension between the leads long before they realize it themselves. You are fundamentally genuinely kind and delightfully unproblematic.<br><br><span class='text-xs opacity-80'>가식 없고 직설적인 당신의 본성은 시청자들에게 엄청난 사이다와 상쾌함을 선사합니다. 친구들에 대한 의리가 뼛속까지 차 있어서, 그들을 보호하기 위해서라면 당장 주먹을 휘두르거나 동네 바보처럼 망가지는 것쯤은 일도 아니라고 생각합니다. 당신의 그 찰진 유머 감각은 숨 막힐 듯 긴장된 상황을 단숨에 부드럽게 이완시켜 주며, 당신을 곁에 두는 것만으로도 깊은 안도감을 느끼게 합니다. 주인공들이 서로에 대한 감정을 깨닫기도 한참 전에 그들 사이에 흐르는 미묘한 텐션을 귀신같이 짚어내는, 길거리에서 터득한 천재적이고 눈치 빠른 정서 지능을 소유하고 있습니다. 당신은 뼛속까지 진실로 다정하며, 함께 있으면 아무런 문제도 스트레스도 일으키지 않는 유쾌함 그 자체입니다.</span>";
        resultsData.M[3].weaknesses = "You chronically use humor as an impenetrable defense mechanism to avoid dealing with your own complex emotions. Whenever a conversation gets too deep, serious, or emotionally demanding, you instantly crack a loud joke to deliberately derail it. Because you are constantly playing the goofy sidekick, people rarely take you seriously when you actually need support or when you try to express genuine romantic feelings towards someone. You risk losing yourself completely in the shadow of your more dramatic friends.<br><br><span class='text-xs opacity-80'>자신의 복잡하고 무거운 감정들을 직면하는 것을 회피하기 위해, 시도 때도 없이 터뜨리는 유머를 절대 뚫을 수 없는 철벽 같은 방어 기제로 만성적으로 사용합니다. 대화가 조금이라도 너무 깊어지거나, 진지해지거나, 감정적인 소모를 요구할 때면, 반사적으로 뜬금없는 농담을 던져 분위기를 의도적으로 깨버립니다. 허구한 날 실없는 소리만 해대는 나사 빠진 사이드킥 역할을 자처하다 보니, 정작 당신이 진심으로 위로가 필요할 때나 누군가에게 진지한 로맨틱 감정을 표현하려 할 때조차 사람들이 당신의 마음을 가볍게 치부하고 믿어주지 않는 억울한 상황이 발생합니다. 매일같이 드라마를 찍고 다니는 주인공 친구들의 거대한 그림자에 가려져, 결국 당신 자신의 진짜 정체성과 사랑을 완전히 잃어버릴 심각한 위험에 처해 있습니다.</span>";

        // Slug 생성기
        function generateSlug(titleHtml) {
            const englishPart = titleHtml.split('<br>')[0];
            return englishPart.replace(/[^a-zA-Z0-9 ]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
        }

        // 다이렉트 접속 시 결과 출력
        window.onload = () => {
            const hash = window.location.hash;
            const match = hash.match(/#\/result\/([a-zA-Z0-9-]+)/);
            
            if(match) {
                const currentSlug = match[1];
                let foundGender = '';
                let foundId = '';
                
                for(let g of ['F', 'M']) {
                    for(let i=0; i<resultsData[g].length; i++) {
                        if(generateSlug(resultsData[g][i].title) === currentSlug) {
                            foundGender = g;
                            foundId = g.toLowerCase() + (i + 1);
                            break;
                        }
                    }
                }
                
                if(foundId) {
                    userGender = foundGender;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    showResult(foundId, true); 
                }
            }
        };

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(fromId).classList.remove('flex');
            
            const toScreen = document.getElementById(toId);
            toScreen.classList.remove('hidden');
            toScreen.classList.add('flex');
        }

        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }

        function showQuestion() {
            // 진행바
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            
            // 페이드인 리셋
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('fade-in');
            void qScreen.offsetWidth; 
            qScreen.classList.add('fade-in');

            // innerHTML 렌더링
            document.getElementById('q-title').innerHTML = questions[currentQ].q;
            document.getElementById('btn-a').innerHTML = questions[currentQ].a;
            document.getElementById('btn-b').innerHTML = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            
            if(currentQ < questions.length) {
                showQuestion();
            } else {
                switchScreen('question-screen', 'loading-screen');
                const finalIdx = score % 4; 
                const genId = userGender === 'F' ? `f${finalIdx + 1}` : `m${finalIdx + 1}`;
                setTimeout(() => showResult(genId, false), 2500);
            }
        }

        function showResult(resultId, isDirectLoad = false) {
            currentResultId = resultId;
            const idx = parseInt(resultId.replace(/[fm]/g, '')) - 1;

            const slug = generateSlug(result.title);
            
            if(!isDirectLoad) {
                switchScreen('loading-screen', 'result-screen');
                window.location.hash = "/result/" + slug;
            }
            
            document.getElementById('r-title').innerHTML = result.title;
            document.getElementById('r-match').innerHTML = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_drama_archetype_w.png')" : "url('k_drama_archetype_m.png')";
            imgDiv.style.backgroundPosition = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"][idx];
            
            // 프리미엄 리포트 UI (블루 계열 테마 5단 분리)
            document.getElementById('r-desc').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-blue-700 uppercase tracking-widest mb-2 flex items-center gap-1">💡 Overview (총평)</h4>
                        <p class="text-sm text-blue-900 leading-relaxed font-medium">${result.overview}</p>
                    </div>
                    <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-indigo-700 uppercase tracking-widest mb-2 flex items-center gap-1">✨ Strengths (핵심 강점)</h4>
                        <p class="text-sm text-indigo-900 leading-relaxed font-medium">${result.strengths}</p>
                    </div>
                    <div class="bg-violet-50 p-5 rounded-2xl border border-violet-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-violet-700 uppercase tracking-widest mb-2 flex items-center gap-1">🤝 Relationship (관계 스타일)</h4>
                        <p class="text-sm text-violet-900 leading-relaxed font-medium">${result.relationship || (userGender === 'F' ? resultsData.F[idx].relationship : resultsData.F[idx].relationship.replace(/여주인공/g, '남주인공'))}</p>
                    </div>
                    <div class="bg-purple-50 p-5 rounded-2xl border border-purple-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-purple-700 uppercase tracking-widest mb-2 flex items-center gap-1">🎯 Fact Check (주의점)</h4>
                        <p class="text-sm text-purple-900 leading-relaxed font-medium">${result.weaknesses}</p>
                    </div>
                    <div class="bg-sky-50 p-5 rounded-2xl border border-sky-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-sky-700 uppercase tracking-widest mb-2 flex items-center gap-1">🔋 Wellness (힐링 가이드)</h4>
                        <p class="text-sm text-sky-900 leading-relaxed font-medium">${result.wellness || (userGender === 'F' ? resultsData.F[idx].wellness : resultsData.F[idx].wellness.replace(/소녀/g, '소년'))}</p>
                    </div>
                </div>
            `;
            
            // F와 M의 relationship, wellness 공통 사용 처리를 위한 빠른 Fallback 구조 세팅 (데이터 무결성 확보)
            if(!result.relationship) {
                 document.getElementById('r-desc').innerHTML = document.getElementById('r-desc').innerHTML.replace("undefined", resultsData.F[idx].relationship);
            }
            if(!result.wellness) {
                 document.getElementById('r-desc').innerHTML = document.getElementById('r-desc').innerHTML.replace("undefined", resultsData.F[idx].wellness);
            }
        }

        function shareResult() {
            const idx = parseInt(currentResultId.replace(/[fm]/g, '')) - 1;
            const slug = generateSlug(resultsData[userGender][idx].title);
            
            const shareUrl = window.location.origin + window.location.pathname + '#/result/' + slug;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('결과 링크가 복사되었습니다!\\n친구들에게 공유해보세요. 🚀');
            }).catch(err => {
                console.error('Copy failed', err);
                alert('링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요.');
            });
        }

        function goLobby() {
            window.location.hash = ''; 
            window.location.reload();  
        }
    </script>
</body>
</html>
