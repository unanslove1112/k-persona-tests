<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Drama Archetype Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg overflow-hidden relative">
        <div id="start-screen" class="px-6 py-12 text-center min-h-screen flex flex-col justify-center bg-gradient-to-b from-blue-50 to-white">
            <h1 class="text-4xl font-extrabold text-blue-600 mb-4 tracking-tight">K-Drama Archetype</h1>
            <p class="text-gray-600 mb-8 font-medium">Which K-Drama cliché are you?</p>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-blue-100 mb-8">
                <h2 class="text-xl font-bold mb-4">Step 1: Select Gender</h2>
                <div class="flex gap-4">
                    <button onclick="selectGender('M')" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-4 rounded-xl shadow-sm">👨 Male</button>
                    <button onclick="selectGender('F')" class="flex-1 bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold py-4 rounded-xl shadow-sm">👩 Female</button>
                </div>
            </div>
        </div>

        <div id="question-screen" class="hidden px-6 py-12 min-h-screen flex flex-col">
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex-1 flex flex-col justify-center">
                <h2 id="q-title" class="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">Question text</h2>
                <div class="space-y-4">
                    <button onclick="answer(0)" id="btn-a" class="w-full text-left bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-300 p-5 rounded-xl shadow-sm"></button>
                    <button onclick="answer(1)" id="btn-b" class="w-full text-left bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-300 p-5 rounded-xl shadow-sm"></button>
                </div>
            </div>
        </div>

        <div id="loading-screen" class="hidden px-6 py-12 text-center min-h-screen flex flex-col justify-center items-center bg-blue-600 text-white">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-white mb-6"></div>
            <h2 class="text-2xl font-bold mb-2">Writing the script...</h2>
        </div>

        <div id="result-screen" class="hidden px-6 py-10 min-h-screen bg-gray-50">
            <div class="text-center mb-6">
                <h1 id="r-title" class="text-3xl font-extrabold text-gray-900">Title</h1>
            </div>
            <div id="r-img-div" class="w-full aspect-square bg-cover bg-no-repeat rounded-2xl mx-auto shadow-inner border border-white/50 mb-6" style="background-size: 200%; background-position: 0% 0%;"></div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6">
                <p id="r-desc" class="text-gray-600 text-center mb-4"></p>
                <div class="bg-blue-50 rounded-xl p-4 text-center">
                    <p class="text-xs text-blue-400 font-bold mb-1">BEST MATCH</p>
                    <p id="r-match" class="font-bold text-blue-700"></p>
                </div>
            </div>
            <div class="space-y-3 mb-8">
                <button onclick="location.href='index.html'" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-md">🏠 Go to Lobby</button>
            </div>
        </div>
    </div>

    <script>
        let userGender = '';
        const questions = [
            { q: "It suddenly rains and you have no umbrella.", a: "Run in the rain smiling happily.", b: "Wait quietly under a roof for someone." },
            { q: "You spilled coffee on a stranger's expensive suit!", a: "Beg for forgiveness and offer to pay for cleaning.", b: "Throw a blank check at them and walk away." },
            { q: "When you're deeply sad...", a: "Cry loudly drinking soju at a street tent.", b: "Stare at the wall while fully clothed in the shower." },
            { q: "You find out a huge secret about your crush.", a: "Confront them immediately to hear the truth.", b: "Keep it to yourself to protect them secretly." },
            { q: "The finale is approaching! What's the ending scene?", a: "A dramatic chase scene at the airport.", b: "A quiet, smiling reunion years later." }
        ];
        
        const resultsData = {
            F: [
                { id: "f1", title: "🏃‍♀️ Resilient Candy", desc: "Never gives up no matter how hard life gets. Melts the cold CEO's heart.", match: "Arrogant Chaebol Heir" },
                { id: "f2", title: "💸 Arrogant Heiress", desc: "Believes money solves everything until you meet someone who treats you differently.", match: "Resilient Candy" },
                { id: "f3", title: "🥺 Secretive Second Lead", desc: "Always cares from behind but misses the timing to confess.", match: "The Best Friend" },
                { id: "f4", title: "🍗 The Best Friend", desc: "Shows up with fried chicken and beer when the lead gets heartbroken.", match: "Secretive Second Lead" }
            ],
            M: [
                { id: "m1", title: "🏃‍♂️ Hardworking Lead", desc: "Juggles 3 part-time jobs but keeps a bright smile.", match: "Arrogant Heiress" },
                { id: "m2", title: "💸 Arrogant Chaebol Heir", desc: "You think money is everything, until you say: 'You're the first person to treat me like this.'", match: "Resilient Candy" },
                { id: "m3", title: "☔ Tragic Second Lead", desc: "Holds an umbrella for her in the rain, but she runs to the main lead.", match: "The Best Friend" },
                { id: "m4", title: "🍗 Loyal Wingman", desc: "Provides comic relief and strictly offers bad dating advice.", match: "Tragic Second Lead" }
            ]
        };

        let currentQ = 0; let score = 0;

        function selectGender(g) {
            userGender = g;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            document.getElementById('q-title').innerText = questions[currentQ].q;
            document.getElementById('btn-a').innerText = questions[currentQ].a;
            document.getElementById('btn-b').innerText = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else {
                document.getElementById('question-screen').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                setTimeout(() => showResult(userGender === 'F' ? `f${(score % 4) + 1}` : `m${(score % 4) + 1}`), 2000);
            }
        }

        function showResult(resultId) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const result = resultsData[userGender].find(r => r.id === resultId);
            
            document.getElementById('r-title').innerText = result.title;
            document.getElementById('r-desc').innerText = result.desc;
            document.getElementById('r-match').innerText = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_drama_archetype_w.png')" : "url('k_drama_archetype_m.png')";
            
            const posArray = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"];
            imgDiv.style.backgroundPosition = posArray[resultsData[userGender].findIndex(r => r.id === resultId)];
        }
    </script>
</body>
</html>
