                    weaknesses: "Your exceptional gift is simultaneously your greatest, most exhausting curse. Absorbing everyone else's chaotic emotions can easily lead to severe empathy fatigue and a complete loss of your own distinct identity. You frequently prioritize healing others to the extreme detriment of your own mental health, silently burning out while pretending everything is perfectly fine. You often significantly overthink minor interpersonal interactions, heavily projecting complicated narratives onto simple situations. Setting strict boundaries feels incredibly guilty to you, but without them, you risk being completely consumed by the loud emotional noise of the world.\n\n<span class='text-xs opacity-80'>당신의 그 경이로운 재능은 동시에 당신을 가장 지치게 만드는 끔찍한 저주이기도 합니다. 타인의 혼란스러운 감정을 스펀지처럼 무분별하게 흡수하는 것은 극심한 공감 피로와 당신 고유의 정체성 상실로 너무나 쉽게 이어질 수 있습니다. 자신의 정신 건강을 극도로 해치면서까지 다른 사람들을 치유하는 것을 우선시하며, 겉으로는 모든 것이 완벽하게 괜찮은 척하면서 속으로는 소리 없이 새카맣게 타들어가며 번아웃을 겪습니다. 사소한 대인관계의 상호작용조차 심각하게 과도하게 생각하여, 단순한 상황에도 복잡하고 무거운 이야기들을 과도하게 투영하곤 합니다. 누군가에게 엄격한 선을 긋는 것을 견딜 수 없는 죄책감으로 여기지만, 단단한 경계선이 없다면 당신은 세상의 시끄러운 감정적 소음에 완전히 집어삼켜질 위험이 매우 큽니다.</span>",

                    overview: "You are a profoundly calming, inherently restorative presence in a chaotic, fast-paced world, radiating a deeply soothing aura that effortlessly mends broken spirits and fractured relationships. You navigate life with extreme, profound gentleness and an infinite well of quiet, enduring patience. Rather than dominating the spotlight with loud aggression, you firmly believe in the immense, transformative power of silent support, deep unconditional acceptance, and profound holistic growth. Your old, incredibly pure soul seeks fundamental harmony above all else, making you the ultimate, irreplaceable emotional sanctuary for anyone exhausted by the harshness of modern reality.\n\n<span class='text-xs opacity-80'>당신은 혼란스럽고 숨 가쁘게 돌아가는 이 세상에서 깊은 평온과 본질적인 회복력을 선사하는 존재로, 부서진 영혼과 산산조각 난 관계를 애쓰지 않고도 봉합해 내는 깊고 따뜻한 오라를 뿜어냅니다. 극한의 심오한 부드러움과 끝없이 솟아나는 고요하고 인내심 넘치는 샘물을 품고 인생을 항해합니다. 시끄러운 공격성으로 화려한 스포트라이트를 독점하려 하기보다는, 침묵 속의 묵묵한 지지, 무조건적이고 깊은 수용, 그리고 본질적이고 총체적인 성장이 가진 거대하고도 변혁적인 힘을 굳게 믿습니다. 당신의 성숙하고 믿을 수 없을 만큼 순수한 영혼은 그 어떤 것보다도 근본적인 조화를 가장 최우선으로 추구하며, 이는 당신을 현대 사회의 가혹함에 지쳐버린 모든 이들에게 절대 대체할 수 없는 궁극의 감정적 안식처로 만들어 줍니다.</span>",
                    strengths: "Your greatest, most magical capability is your profound, unwavering ability to foster deep healing and highly organic growth in any environment you enter. You possess a unique, quiet resilience that allows you to absorb immense negativity without easily becoming deeply cynical. People inherently trust you with their darkest, most vulnerable secrets because you offer a completely non-judgmental, profoundly safe space. Your immense capacity for extreme forgiveness and your gentle, highly nurturing approach successfully bring out the absolute best, most authentic versions of everyone you continuously interact with.\n\n<span class='text-xs opacity-80'>당신의 가장 위대하고 마법 같은 능력은, 당신이 발을 들이는 그 어떤 환경에서도 깊은 치유와 고도로 유기적인 성장을 촉진해 내는 흔들림 없는 심오한 재능입니다. 거대한 부정적인 에너지를 묵묵히 흡수하면서도 결코 쉽게 냉소적으로 변하지 않는, 당신만의 고유하고 조용한 회복탄력성을 소유하고 있습니다. 당신은 일말의 편견이나 섣부른 판단이 배제된, 완벽하게 안전하고 깊이 있는 공간을 제공하기 때문에, 사람들은 본능적으로 자신의 가장 어둡고 취약한 비밀을 당신에게 온전히 털어놓으며 신뢰합니다. 극단적인 용서에 대한 당신의 거대한 수용력과 한없이 부드럽고 헌신적인 접근 방식은, 당신과 지속적으로 교류하는 모든 사람들의 가장 훌륭하고 진실된 모습을 성공적으로 이끌어내는 기적을 만듭니다.</span>",
                    relationship: "In intimacy, you are entirely devoted, incredibly selfless, and profoundly nurturing. You build highly stable, deeply meaningful relationships entirely based on unconditional mutual trust, extreme spiritual warmth, and a shared desire for absolute peace. However, because you naturally default to continuously giving, you frequently attract highly broken or emotionally demanding individuals who subconsciously view you solely as their personal, endless rehab center. You vitally need a partner who explicitly recognizes your immense, silent sacrifices and actively, generously pours love back into your deeply depleted cup, rather than just constantly taking from it.\n\n<span class='text-xs opacity-80'>친밀한 관계에 있어서 당신은 자신을 완전히 헌신하고, 믿을 수 없을 만큼 이타적이며, 깊이 있게 상대를 보살핍니다. 무조건적인 상호 신뢰, 극도로 영적인 따뜻함, 그리고 절대적인 평화에 대한 공통된 열망을 온전한 기반으로 삼아 고도로 안정적이고 의미 깊은 관계를 구축합니다. 하지만 끝없이 내어주는 것이 당신의 자연스러운 기본값이기 때문에, 무의식적으로 당신을 자신만의 끝없는 개인 재활 센터로만 여기는, 몹시 망가져 있거나 감정적 요구가 비정상적으로 많은 사람들을 자석처럼 끌어당기는 경향이 짙습니다. 당신에게는 당신의 거대하고 침묵하는 희생을 명확하게 인지하고, 끊임없이 당신의 에너지를 빼앗아가기만 하는 것이 아니라 바닥난 당신의 잔에 적극적이고 관대하게 사랑을 다시 채워줄 수 있는 파트너가 절대적으로, 생존의 문제만큼 필요합니다.</span>",
                    weaknesses: "Your extreme, almost phobic avoidance of intense conflict often forces you to quietly swallow your own legitimate pain to forcefully maintain an artificial, highly fragile peace. By constantly over-accommodating others' loud needs, you run the severe risk of completely losing your own voice and firmly establishing deeply unhealthy, co-dependent dynamics. You often heavily struggle to establish firm boundaries, falsely fearing that saying a strict 'no' makes you a deeply bad or unloving person. This profound self-neglect can eventually lead to immense, silent physical exhaustion and deep, unexpressed resentment.\n\n<span class='text-xs opacity-80'>격렬한 갈등에 대한 거의 공포증에 가까운 극단적인 회피 성향은, 종종 인위적이고 몹시 부서지기 쉬운 거짓 평화를 억지로 유지하기 위해 당신 자신의 정당한 고통을 묵묵히 삼켜버리도록 강요합니다. 다른 사람들의 시끄러운 요구에 끊임없이 과도하게 순응함으로써, 당신 고유의 목소리를 완전히 잃어버리고 매우 불건전하고 상호 의존적인 관계의 굴레를 견고하게 형성할 심각한 위험에 처해 있습니다. 단호하게 '아니오'라고 말하는 것이 당신을 몹시 나쁘거나 사랑이 없는 사람으로 만든다는 잘못된 두려움 때문에, 단단한 경계선을 설정하는 데 엄청난 어려움을 겪습니다. 이러한 심오한 수준의 자기 방치는 결국 감당할 수 없는 거대한 육체적 침묵의 번아웃과 밖으로 표출되지 못한 깊고 차가운 원망으로 이어질 수 있습니다.</span>",
                    wellness: "Your ultimate healing journey absolutely must begin with decisively directing your immense superpower of compassion strictly inward. You must learn that prioritizing your own essential well-being is not inherently selfish; it is incredibly necessary for your absolute survival. Dedicate your weekends entirely to deeply restorative, solitary practices—such as cultivating a lush botanical garden, engaging in holistic sound bath meditation, or simply sleeping undisturbed. Vigorously practice the highly uncomfortable art of politely but firmly declining requests. True, enduring harmony is absolutely impossible if your own inner world is silently collapsing from heavy exhaustion.\n\n<span class='text-xs opacity-80'>당신의 궁극적인 치유의 여정은, 당신이 가진 거대한 연민의 초능력을 단호하고 엄격하게 당신 내면으로 돌리는 것에서부터 반드시 시작되어야 합니다. 당신 자신의 필수적인 안녕을 최우선으로 삼는 것이 본질적으로 이기적인 행동이 아니라, 당신의 절대적인 생존을 위해 믿을 수 없을 만큼 필수불가결하다는 사실을 뼈저리게 배워야만 합니다. 주말에는 싱그러운 식물 가꾸기, 온몸을 감싸는 홀리스틱 사운드 배스(싱잉볼) 명상에 참여하기, 혹은 누구의 방해도 받지 않고 그저 깊은 잠에 빠져드는 등 영혼을 깊이 회복시키는 고독한 활동에 온전히 헌신하세요. 타인의 무리한 부탁을 예의 바르면서도 아주 단호하게 거절하는, 그 몹시 불편한 기술을 격렬하게 연습해야 합니다. 당신의 내면 세계가 무거운 피로에 짓눌려 소리 없이 무너져 내리고 있다면, 진정으로 영속적인 조화란 절대적으로 불가능하다는 것을 명심하세요.</span>",
                    match: "⏳ The Time Controller\n(시간의 지배자)" 
                }
            ]
        };

        // 복제 및 남성형 타이틀/매칭 정보 업데이트

        resultsData.M[0].title = "⏳ The Time Traveler\n(시간의 지배자)";
        resultsData.M[1].title = "🧠 The Mind Reader\n(속마음 리더)";
        resultsData.M[2].title = "💥 The Powerhouse\n(천하장사 해결사)";
        resultsData.M[3].title = "🌿 The Miracle Healer\n(치유의 능력자)";
        
        resultsData.M[0].match = "🌿 The Miracle Healer\n(치유의 능력자)";
        resultsData.M[1].match = "💥 The Powerhouse\n(천하장사 해결사)";
        resultsData.M[2].match = "🧠 The Mind Reader\n(속마음 리더)";
        resultsData.M[3].match = "⏳ The Time Traveler\n(시간의 지배자)";

        function generateSlug(titleHtml) {
            const englishPart = titleHtml.split('\n')[0];
            return englishPart.replace(/[^a-zA-Z0-9 ]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
        }

        window.onload = () => {
            const hash = window.location.hash;
            const match = hash.match(/#\/result\/([a-zA-Z0-9-]+)/);
            
            if(match) {
                const currentSlug = match[1];
                let foundGender = '';
                let foundId = '';
                
                for(let g of ['F', 'M']) {
                    for(let i=0; i<resultsData[g].length; i++) {
                        if(generateSlug(resultsData[g][i].title) === currentSlug) {
                            foundGender = g;
                            foundId = g.toLowerCase() + (i + 1);
                            break;
                        }
                    }
                }
                
                if(foundId) {
                    userGender = foundGender;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    showResult(foundId, true); 
                }
            }
        };

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.add('hidden');
            document.getElementById(toId).classList.remove('hidden');
        }

        function selectGender(g) {
            userGender = g;
            switchScreen('start-screen', 'question-screen');
            showQuestion();
        }

        function showQuestion() {
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
            
            const qContainer = document.getElementById('q-container');
            qContainer.classList.remove('fade-in');
            void qContainer.offsetWidth; 
            qContainer.classList.add('fade-in');

            document.getElementById('q-title').innerText = questions[currentQ].q;
            document.getElementById('btn-a').innerText = questions[currentQ].a;
            document.getElementById('btn-b').innerText = questions[currentQ].b;
        }

        function answer(val) {
            if(val === 0) score++;
            currentQ++;
            
            if(currentQ < questions.length) {
                showQuestion();
            } else {
                switchScreen('question-screen', 'loading-screen');
                const finalIdx = score % 4; 
                const genId = userGender === 'F' ? `f${finalIdx + 1}` : `m${finalIdx + 1}`;
                setTimeout(() => showResult(genId, false), 2500);
            }
        }

        function showResult(resultId, isDirectLoad = false) {
            currentResultId = resultId;
            const idx = parseInt(resultId.replace(/[fm]/g, '')) - 1;
            const result = resultsData[userGender][idx];
            
            const slug = generateSlug(result.title);
            
            if(!isDirectLoad) {
                switchScreen('loading-screen', 'result-screen');
                window.location.hash = "/result/" + slug;
            }
            
            document.getElementById('r-title').innerText = result.title;
            document.getElementById('r-match').innerText = result.match;
            
            const imgDiv = document.getElementById('r-img-div');
            imgDiv.style.backgroundImage = userGender === 'F' ? "url('k_superpower_drama_w.png')" : "url('k_superpower_drama_m.png')";
            imgDiv.style.backgroundPosition = ["0% 0%", "100% 0%", "0% 100%", "100% 100%"][idx];
            
            // Teal 컬러 테마에 맞춘 5가지 상세 결과 레이아웃
            document.getElementById('r-desc').innerHTML = `
                <div class="space-y-4">
                    <div class="bg-teal-50 p-5 rounded-2xl border border-teal-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-teal-700 uppercase tracking-widest mb-2 flex items-center gap-1">💡 Overview (총평)</h4>
                        <p class="text-sm text-teal-900 leading-relaxed font-medium whitespace-pre-line">${result.overview}</p>
                    </div>
                    <div class="bg-cyan-50 p-5 rounded-2xl border border-cyan-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-cyan-700 uppercase tracking-widest mb-2 flex items-center gap-1">✨ Strengths (핵심 강점)</h4>
                        <p class="text-sm text-cyan-900 leading-relaxed font-medium whitespace-pre-line">${result.strengths}</p>
                    </div>
                    <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-blue-700 uppercase tracking-widest mb-2 flex items-center gap-1">🤝 Relationship (관계 스타일)</h4>
                        <p class="text-sm text-blue-900 leading-relaxed font-medium whitespace-pre-line">${result.relationship}</p>
                    </div>
                    <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-indigo-700 uppercase tracking-widest mb-2 flex items-center gap-1">🎯 Fact Check (주의점)</h4>
                        <p class="text-sm text-indigo-900 leading-relaxed font-medium whitespace-pre-line">${result.weaknesses}</p>
                    </div>
                    <div class="bg-sky-50 p-5 rounded-2xl border border-sky-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-sky-700 uppercase tracking-widest mb-2 flex items-center gap-1">🔋 Wellness (힐링 가이드)</h4>
                        <p class="text-sm text-sky-900 leading-relaxed font-medium whitespace-pre-line">${result.wellness}</p>
                    </div>
                </div>
            `;
        }

        function shareResult() {
            const idx = parseInt(currentResultId.replace(/[fm]/g, '')) - 1;
            const slug = generateSlug(resultsData[userGender][idx].title);
            const shareUrl = window.location.origin + window.location.pathname + '#/result/' + slug;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('결과 링크가 복사되었습니다!\\n친구들에게 공유해보세요. 🚀');
            }).catch(err => {
                console.error('Copy failed', err);
                alert('링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요.');
            });
        }

        function goLobby() {
            window.location.href = 'https://k-persona-tests.vercel.app/';
        }
    </script>
